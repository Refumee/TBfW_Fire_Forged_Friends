#textdomain wesnoth-fff
[unit_type]
    id=Amazon
    # Translatable:
    name= _ "Amazon"
    description=_"Perhaps not technically a member of the legendary all-female warband from the far past, Cheska does fit the general description very well, and could probably have stood along its members in a battle, had she been born several thousand years ago in entirely another human empire. But she did not, so this is the nearest she will get in that regard."
    #textdomain wesnoth-unit
    # Attributes:
    race=human
    gender=female

    # Appearance and description:
    # TODO: Fix these...
    image="units/human-loyalists/swordsman.png"
    profile="portraits/humans/royal-guard.png"


    # Game statistics:
    hitpoints=37 # TODO: More of these!
    movement_type=smallfoot
    movement=5
    experience=82
    level=2
    alignment=lawful
    advances_to=Warmistress
    cost=29
    usage=fighter

    # Attacks:
    [attack]
        name=zweihänder
        description=_"zweihänder"
        icon=attacks/greatsword-human.png
        type=blade
        range=melee
        damage=14
        number=2
    [/attack]
    [attack]
        name=crossbow
        description=_"crossbow"
        icon=attacks/crossbow-human.png
        type=pierce
        range=ranged
        damage=14
        number=1
    [/attack]


    # Abilities:
    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]

    # Sounds and animations:
    # TODO: Fix these...
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "units/human-loyalists/swordsman-defend.png" "units/human-loyalists/swordsman.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        [frame]
            begin=0
            end=100
            image="units/human-loyalists/swordsman-idle-1.png"
        [/frame]
        [frame]
            begin=100
            end=200
            image="units/human-loyalists/swordsman-idle-2.png"
        [/frame]
        [frame]
            begin=200
            end=300
            image="units/human-loyalists/swordsman-idle-3.png"
        [/frame]
        [frame]
            begin=300
            end=400
            image="units/human-loyalists/swordsman-idle-4.png"
        [/frame]
        [frame]
            begin=400
            end=500
            image="units/human-loyalists/swordsman-idle-5.png"
        [/frame]
        [frame]
            begin=500
            end=600
            image="units/human-loyalists/swordsman-idle-6.png"
        [/frame]
        [frame]
            begin=600
            end=700
            image="units/human-loyalists/swordsman-idle-7.png"
        [/frame]
        [frame]
            begin=700
            end=800
            image="units/human-loyalists/swordsman-idle-8.png"
        [/frame]
        [frame]
            begin=800
            end=900
            image="units/human-loyalists/swordsman-idle-9.png"
        [/frame]
        [frame]
            begin=900
            end=1000
            image="units/human-loyalists/swordsman-idle-10.png"
        [/frame]
        [frame]
            begin=1000
            end=1100
            image="units/human-loyalists/swordsman-idle-11.png"
        [/frame]
        [frame]
            begin=1100
            end=1200
            image="units/human-loyalists/swordsman-idle-12.png"
        [/frame]
        [frame]
            begin=1200
            end=1600
            image="units/human-loyalists/swordsman-idle-4.png"
        [/frame]
        [frame]
            begin=1600
            end=1700
            image="units/human-loyalists/swordsman-idle-12.png"
        [/frame]
        [frame]
            begin=1700
            end=1800
            image="units/human-loyalists/swordsman-idle-3.png"
        [/frame]
        [frame]
            begin=1800
            end=1900
            image="units/human-loyalists/swordsman-idle-2.png"
        [/frame]
        [frame]
            begin=1900
            end=2000
            image="units/human-loyalists/swordsman-idle-1.png"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=zweihänder
        [/filter_attack]
        [frame]
            begin=-200
            end=-175
            image="units/human-loyalists/swordsman.png"
        [/frame]
        [frame]
            begin=-175
            end=-75
            image="units/human-loyalists/swordsman-attack-1.png"
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=-75
                end=75
                image="units/human-loyalists/swordsman-attack-2.png"
                sound={SOUND_LIST:SWORD_SWISH}
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=-75
                end=75
                image="units/human-loyalists/swordsman-attack-2.png"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
        [frame]
            begin=75
            end=200
            image="units/human-loyalists/swordsman-attack-3.png"
        [/frame]
    [/attack_anim]
    # TODO: Correct this!
    [attack_anim]
        [filter_attack]
            name=crossbow
        [/filter_attack]
        [missile_frame]
            begin=-150
            end=0
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [frame]
            begin=-400
            end=-300
            image="units/human-loyalists/lieutenant-crossbow.png"
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=-300
                end=-150
                image="units/human-loyalists/lieutenant-crossbow-attack1.png"
                sound=crossbow.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=-300
                end=-150
                image="units/human-loyalists/lieutenant-crossbow-attack1.png"
                sound=crossbow-miss.ogg
            [/frame]
        [/else]
        [frame]
            begin=-150
            end=0
            image="units/human-loyalists/lieutenant-crossbow-attack2.png"
        [/frame]
    [/attack_anim]
[/unit_type]
