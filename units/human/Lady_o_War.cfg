#textdomain wesnoth-fff
[unit_type]
    id=Lady_o_War
    # Translatable:
    name= _ "Lady o' War"
    description=_"Perhaps it is peaceful in most of Wesnoth, allowing many battle commanders and generals to grow idle, but Cheska Kuhral has seen a great deal of warfare in that same time. Still young, idealistic, and somewhat naive, she regardless holds enough skill and authority - combined with cunning, intelligence, and empathy towards her troops - to be counted equal among those other men, those who have not seen serious battle since the Turmoil of Asheviere."
    #textdomain wesnoth-units
    # Attributes:
    race=human
    gender=female

    # Appearance and description:
    # TODO: Fix these...
    image="units/human-loyalists/marshal.png"
    profile="portraits/humans/royal-guard.png"

    # Game statistics:
    hitpoints=60 # TODO: More of these?
    movement_type=smallfoot
    movement=6
    experience=150
    level=4
    alignment=lawful
    cost=66
    usage=fighter
    advances_to=null
    {AMLA_DEFAULT}
    [resistance]
        blade=90
        pierce=90
        impact=90
    [/resistance]

    # Attacks:
    [attack]
        name=zweihänder
        description=_"zweihänder"
        icon=attacks/greatsword-human.png
        type=blade
        range=melee
        damage=20
        number=3
    [/attack]
    [attack] # TODO: balance against the Zweihänder?
        name=morningstar
        description=_"morningstar"
        icon=attacks/morning-star.png
        type=impact
        range=melee
        damage=20
        number=3
    [/attack]
    [attack]
        name=crossbow
        description=_"crossbow"
        icon=attacks/crossbow-human.png
        type=pierce
        range=ranged
        damage=30
        number=1
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    [/attack]


    # Abilities:
    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]

    # Sounds and animations:
    # TODO: Fix these...
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM_RANGE "units/human-loyalists/marshal-defend-2.png" "units/human-loyalists/marshal-defend-1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} melee }
    {DEFENSE_ANIM_RANGE "units/human-loyalists/marshal-crossbow-defend.png" "units/human-loyalists/marshal-crossbow.png" {SOUND_LIST:HUMAN_FEMALE_HIT} ranged }
    [leading_anim]
        [frame]
            begin=-150
            end=150
            image="units/human-loyalists/marshal-leading.png"
        [/frame]
    [/leading_anim]
    [death]
        [frame]
            begin=0
            end=75
            image="units/human-loyalists/marshal-die-1.png"
        [/frame]
        [frame]
            begin=75
            end=150
            image="units/human-loyalists/marshal-die-2.png"
        [/frame]
        [frame]
            begin=150
            end=225
            image="units/human-loyalists/marshal-die-3.png"
        [/frame]
        [frame]
            begin=225
            end=300
            image="units/human-loyalists/marshal-die-4.png"
        [/frame]
        [frame]
            begin=300
            end=375
            image="units/human-loyalists/marshal-die-5.png"
        [/frame]
        [frame]
            begin=375
            end=450
            image="units/human-loyalists/marshal-die-6.png"
        [/frame]
        [frame]
            begin=450
            end=525
            image="units/human-loyalists/marshal-die-7.png"
        [/frame]
        [frame]
            begin=525
            end=600
            image="units/human-loyalists/marshal-die-8.png"
        [/frame]
        [frame]
            begin=600
            end=875
            image="units/human-loyalists/marshal-die-9.png"
        [/frame]
        [frame]
            begin=875
            end=1000
            image="units/human-loyalists/marshal-die-10.png"
        [/frame]
    [/death]
    [attack_anim]
        [filter_attack]
            name=crossbow
        [/filter_attack]
        [missile_frame]
            begin=-150
            end=0
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [frame]
            begin=-400
            end=-300
            image="units/human-loyalists/marshal-crossbow.png"
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=-300
                end=-150
                image="units/human-loyalists/marshal-crossbow-attack1.png"
                sound=crossbow.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=-300
                end=-150
                image="units/human-loyalists/marshal-crossbow-attack1.png"
                sound=crossbow-miss.ogg
            [/frame]
        [/else]
        [frame]
            begin=-150
            end=0
            image="units/human-loyalists/marshal-crossbow-attack2.png"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=zweihänder
        [/filter_attack]
        [frame]
            begin=-300
            end=-250
            image="units/human-loyalists/marshal.png"
            offset=0.0~0.1
        [/frame]
        [frame]
            begin=-250
            end=-200
            image="units/human-loyalists/marshal-defend-1.png"
            offset=0.1~0.15
        [/frame]
        [frame]
            begin=-200
            end=-100
            image="units/human-loyalists/marshal-attack-sword1.png"
            offset=0.15~0.35
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=-100
                end=-25
                image="units/human-loyalists/marshal-attack-sword2.png"
                sound={SOUND_LIST:SWORD_SWISH}
                offset=0.35~0.45
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=-100
                end=-25
                image="units/human-loyalists/marshal-attack-sword2.png"
                sound={SOUND_LIST:MISS}
                offset=0.35~0.45
            [/frame]
        [/else]
        [frame]
            begin=-25
            end=75
            image="units/human-loyalists/marshal-attack-sword3.png"
            offset=0.45~0.5
        [/frame]
        [frame]
            begin=75
            end=95
            image="units/human-loyalists/marshal-attack-sword4.png"
            offset=0.5
        [/frame]
        [frame]
            begin=95
            end=125
            image="units/human-loyalists/marshal-attack-sword4.png"
            offset=0.5~0.4
        [/frame]
        [frame]
            begin=125
            end=200
            image="units/human-loyalists/marshal-attack-sword5.png"
            offset=0.4~0.2
        [/frame]
        [frame]
            begin=150
            end=225
            image="units/human-loyalists/marshal.png"
            offset=0.2~0.0
        [/frame]
    [/attack_anim]
    # TODO: Fix this!
    [attack_anim]
        [filter_attack]
            name=morningstar
        [/filter_attack]
        [frame]
            begin=-300
            end=-250
            image="units/human-loyalists/marshal.png"
            offset=0.0~0.1
        [/frame]
        [frame]
            begin=-250
            end=-200
            image="units/human-loyalists/marshal-defend-1.png"
            offset=0.1~0.15
        [/frame]
        [frame]
            begin=-200
            end=-100
            image="units/human-loyalists/marshal-attack-sword1.png"
            offset=0.15~0.35
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=-100
                end=-25
                image="units/human-loyalists/marshal-attack-sword2.png"
                sound={SOUND_LIST:SWORD_SWISH}
                offset=0.35~0.45
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=-100
                end=-25
                image="units/human-loyalists/marshal-attack-sword2.png"
                sound={SOUND_LIST:MISS}
                offset=0.35~0.45
            [/frame]
        [/else]
        [frame]
            begin=-25
            end=75
            image="units/human-loyalists/marshal-attack-sword3.png"
            offset=0.45~0.5
        [/frame]
        [frame]
            begin=75
            end=95
            image="units/human-loyalists/marshal-attack-sword4.png"
            offset=0.5
        [/frame]
        [frame]
            begin=95
            end=125
            image="units/human-loyalists/marshal-attack-sword4.png"
            offset=0.5~0.4
        [/frame]
        [frame]
            begin=125
            end=200
            image="units/human-loyalists/marshal-attack-sword5.png"
            offset=0.4~0.2
        [/frame]
        [frame]
            begin=150
            end=225
            image="units/human-loyalists/marshal.png"
            offset=0.2~0.0
        [/frame]
    [/attack_anim]
[/unit_type]
