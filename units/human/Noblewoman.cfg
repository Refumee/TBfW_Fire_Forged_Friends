#textdomain wesnoth-fff
[unit_type]
	id=Noblewoman
    # Translatable:
    name= _ "Noblewoman"
    description=_"Nobles in Wesnoth are often trained in art of war and commanding their own armies, then knighted and sent to the battlefield to lead the peasants and commoners into battle. These young bluebloods often lack of actual battle experience: the pride and arrogance they often feel towards the ""lesser people"" they're commanding, and insisting on being in charge even when their more experienced subordinates could handle the job better, often results in quite impressive military disasters. Cheska Kuhral has managed to evade most of these traps, however, growing up into much more pleasant and humble than many of her peers."
    #textdomain wesnoth-units
    # Attributes:
    race=human
    gender=female

    # Appearance and description:
    # TODO: Fix these...
    image="units/human-loyalists/lieutenant.png"

    # Game statistics:
    hitpoints=30 # TODO: More of these?
    movement_type=smallfoot
    movement=5
    experience=35
    level=1
    alignment=lawful
    advances_to=Amazon
    cost=20
    usage=fighter
    [resistance]
        blade=80
        impact=80
    [/resistance]

    # Attacks:
    [attack]
        name=zweihänder
        description=_"zweihänder"
        icon=attacks/greatsword-human.png
        type=blade
        range=melee
        damage=10
        number=2
    [/attack]
    [attack]
        name=crossbow
        description=_"crossbow"
        icon=attacks/crossbow-human.png
        type=pierce
        range=ranged
        damage=10
        number=1
    [/attack]


    # Abilities:
    [abilities]
        {ABILITY_LEADERSHIP} # TODO: Really extra leadership level?
    [/abilities]

    # Sounds and animations:
    # TODO: Fix these...
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM_RANGE "units/human-loyalists/lieutenant-defend.png" "units/human-loyalists/lieutenant.png" {SOUND_LIST:HUMAN_FEMALE_HIT} melee}
    {DEFENSE_ANIM_RANGE "units/human-loyalists/lieutenant-crossbow-defend.png" "units/human-loyalists/lieutenant-crossbow.png" {SOUND_LIST:HUMAN_FEMALE_HIT} ranged}
    [leading_anim]
        [frame]
            begin=-150
            end=150
            image="units/human-loyalists/lieutenant-leading.png"
        [/frame]
    [/leading_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=100
            image="units/human-loyalists/lieutenant-idle-1.png"
        [/frame]
        [frame]
            duration=100
            image="units/human-loyalists/lieutenant-idle-2.png"
        [/frame]
        [frame]
            duration=300
            image="units/human-loyalists/lieutenant-idle-3.png"
        [/frame]
        [frame]
            duration=50
            image="units/human-loyalists/lieutenant-idle-4.png"
        [/frame]
        [frame]
            duration=50
            image="units/human-loyalists/lieutenant-idle-5.png"
        [/frame]
        [frame]
            duration=50
            image="units/human-loyalists/lieutenant-idle-6.png"
        [/frame]
        [frame]
            duration=50
            image="units/human-loyalists/lieutenant-idle-7.png"
        [/frame]
        [frame]
            duration=500
            image="units/human-loyalists/lieutenant-idle-8.png"
        [/frame]
        [frame]
            duration=100
            image="units/human-loyalists/lieutenant-idle-7.png"
        [/frame]
        [frame]
            duration=100
            image="units/human-loyalists/lieutenant-idle-6.png"
        [/frame]
        [frame]
            duration=100
            image="units/human-loyalists/lieutenant-idle-5.png"
        [/frame]
        [frame]
            duration=100
            image="units/human-loyalists/lieutenant-idle-9.png"
        [/frame]
        [frame]
            duration=100
            image="units/human-loyalists/lieutenant-idle-1.png"
        [/frame]
    [/idle_anim]

    [death]
        start_time=0
        [frame]
            duration=75
            image="units/human-loyalists/lieutenant-die-1.png"
        [/frame]
        [frame]
            duration=75
            image="units/human-loyalists/lieutenant-die-2.png"
        [/frame]
        [frame]
            duration=75
            image="units/human-loyalists/lieutenant-die-3.png"
        [/frame]
        [frame]
            duration=75
            image="units/human-loyalists/lieutenant-die-4.png"
        [/frame]
        [frame]
            duration=75
            image="units/human-loyalists/lieutenant-die-5.png"
        [/frame]
        [frame]
            duration=75
            image="units/human-loyalists/lieutenant-die-6.png"
        [/frame]
        [frame]
            duration=75
            image="units/human-loyalists/lieutenant-die-7.png"
        [/frame]
        [frame]
            duration=75
            image="units/human-loyalists/lieutenant-die-8.png"
        [/frame]
        [frame]
            duration=75
            image="units/human-loyalists/lieutenant-die-9.png"
        [/frame]
    [/death]
    [attack_anim]
        [filter_attack]
            name=crossbow
        [/filter_attack]
        [missile_frame]
            begin=-150
            end=0
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [frame]
            begin=-400
            end=-300
            image="units/human-loyalists/lieutenant-crossbow.png"
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=-300
                end=-150
                image="units/human-loyalists/lieutenant-crossbow-attack1.png"
                sound=crossbow.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=-300
                end=-150
                image="units/human-loyalists/lieutenant-crossbow-attack1.png"
                sound=crossbow-miss.ogg
            [/frame]
        [/else]
        [frame]
            begin=-150
            end=0
            image="units/human-loyalists/lieutenant-crossbow-attack2.png"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=zweihänder
        [/filter_attack]
        [frame]
            begin=-225
            end=-175
            image="units/human-loyalists/lieutenant.png"
        [/frame]
        [frame]
            begin=-175
            end=-100
            image="units/human-loyalists/lieutenant-attack-sword-1.png"
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=-100
                end=50
                image="units/human-loyalists/lieutenant-attack-sword-2.png"
                sound={SOUND_LIST:SWORD_SWISH}
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=-100
                end=50
                image="units/human-loyalists/lieutenant-attack-sword-2.png"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
        [frame]
            begin=50
            end=150
            image="units/human-loyalists/lieutenant-attack-sword-3.png"
        [/frame]
    [/attack_anim]
[/unit_type]
