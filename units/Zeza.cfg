#textdomain wesnoth-units
[unit_type]
    id=Zeza
    name= _ "Drake Fighter"
    race=drake
    gender=male
    image="units/zeza/zeza.png"
    profile="portraits/drake/fighter.webp"
    hitpoints=43
    movement_type=drakefoot
    movement=5
    experience=41
    level=1
    alignment=lawful
    advances_to=null
    {FFF_AMLA_DEFAULT}
	#{ZEZA_HERO_ADVANCEMENTS}
    cost=17
    usage=fighter
    description= _ "Drake Fighters wield curved war blades, and possess the fire-breathing skills of their ancestors. They can also fly, which is troubling to any foe. Their great strength, coupled with their hardened scales, is rightly frightening to swordsman of any other race."
    die_sound=drake-die.ogg
    {DEFENSE_ANIM "units/zeza/zeza-defend-2.png" "units/zeza/zeza-defend-1.png" {SOUND_LIST:DRAKE_HIT} }
    [attack]
        name=war blade
        description=_"war blade"
        type=blade
        range=melee
        damage=7
        number=3
        icon=attacks/warblade.png
    [/attack]
    [attack]
        name=fire breath
        description=_"fire breath"
        icon=attacks/fire-breath-drake.png
        type=fire
        range=ranged
        damage=3
        number=3
    [/attack]
    [attack_anim]
        [filter_attack]
            name=fire breath
        [/filter_attack]
        direction=se,sw
        missile_start_time=-400
        [missile_frame]
            halo=projectiles/fire-breath-se-[1~5].png:80
            halo_x,halo_y=35,40
        [/missile_frame]
        start_time=-900
        [frame]
            image="units/zeza/zeza.png:20"
        [/frame]
        [frame]
            image="units/zeza/zeza-fire-inhale-[1~4,2].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS flame-big.ogg flame-big-miss.ogg -480}
        [frame]
            image="units/zeza/zeza-fire-se-[1~3,2,1].png:100"
        [/frame]
    [/attack_anim]
	
    [attack_anim]
        [filter_attack]
            name=fire breath
        [/filter_attack]
        direction=ne,nw
        missile_start_time=-400
        [missile_frame]
            halo=projectiles/fire-breath-ne-[1~5].png:80
            halo_x,halo_y=35,-20
        [/missile_frame]
        start_time=-900
        [frame]
            image="units/zeza/zeza.png:20"
        [/frame]
        [frame]
            image="units/zeza/zeza-fire-inhale-[1~4,2].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS flame-big.ogg flame-big-miss.ogg -480}
        [frame]
            image="units/zeza/zeza-fire-se-[1~3,2,1].png:100"
        [/frame]
    [/attack_anim]
	
    [attack_anim]
        [filter_attack]
            name=fire breath
        [/filter_attack]
        direction=s
        missile_start_time=-400
        [missile_frame]
            halo=projectiles/fire-breath-s-[1~5].png:80
            halo_x,halo_y=8,50
        [/missile_frame]
        start_time=-900
        [frame]
            image="units/zeza/zeza.png:20"
        [/frame]
        [frame]
            image="units/zeza/zeza-fire-inhale-[1~4,2].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS flame-big.ogg flame-big-miss.ogg -480}
        [frame]
            image="units/zeza/zeza-fire-s-[1~3,2,1].png:100"
        [/frame]
    [/attack_anim]
	
    [attack_anim]
        [filter_attack]
            name=fire breath
        [/filter_attack]
        direction=n
        missile_start_time=-400
        [missile_frame]
            halo=projectiles/fire-breath-n-[1~5].png:80
            halo_x,halo_y=8,-50
        [/missile_frame]
        start_time=-900
        [frame]
            image="units/zeza/zeza.png:20"
        [/frame]
        [frame]
            image="units/zeza/zeza-fire-inhale-[1~4,2].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS flame-big.ogg flame-big-miss.ogg -480}
        [frame]
            image="units/zeza/zeza-fire-se-[1~3,2,1].png:100"
        [/frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=war blade
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-400
        [frame]
            image="units/zeza/zeza.png"
        [/frame]
        [frame]
            image="units/zeza/zeza-melee-[1~7].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
        [frame]
            image="units/zeza/zeza.png"
        [/frame]
    [/attack_anim]
[/unit_type]
