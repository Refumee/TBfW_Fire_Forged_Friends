#textdomain wesnoth-units
[unit_type]
    id=Silan
    name= _ "Dark Adept"
    # wmllint: general spelling mage mages magery magecraft
    race=human
    gender=male
    image="units/silan.png"
    profile="portraits/humans/dark-adept.webp"
    hitpoints=24
    movement_type=smallfoot
    movement=5
    experience=48
    level=1
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=20
    usage=mixed fighter
    description= _ "A wanderer of indeterminate age, using the dark arts of necromancy in his one-man war against the enemies of Wesnoth. His past and motives still remain largely unclear."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/silan.png" "units/silan.png" {SOUND_LIST:HUMAN_OLD_HIT} }
    [attack]
        name=staff
        description=_"staff"
        icon=attacks/staff-magic.png
        type=impact
        range=melee
        damage=5
        number=1
    [/attack]
    [attack]
        name=chill wave
        description=_"chill wave"
        type=cold
        range=ranged
        damage=10
        number=2
        icon=attacks/iceball.png
        specials_list=magical
    [/attack]
    [attack]
        name=shadow wave
        description=_"shadow wave"
        type=arcane
        range=ranged
        damage=7
        number=2
        icon=attacks/dark-missile.png
        specials_list=magical
    [/attack]

    [attack_anim]
        [filter_attack]
            name=staff
        [/filter_attack]
        start_time=-250
        [frame]
            image="units/silan.png:50"
        [/frame]
        [frame]
            image="units/silan.png:[100,200]"
        [/frame]
        {SOUND:HIT_AND_MISS staff.ogg staff-miss.ogg -125}
        [frame]
            image="units/silan.png:50"
        [/frame]
        [frame]
            image="units/silan.png:50"
        [/frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=chill wave
        [/filter_attack]

        {MISSILE_FRAME_CHILL_WAVE 0 -12}

        start_time=-450
        [frame]
            image="units/silan.png:25"
        [/frame]
        [frame]
            image="units/silan.png:[35,75,15]"
        [/frame]
        [frame]
            image="units/silan.png"
            halo=halo/undead/dark-magic-[1~6].png:50
            halo_x,halo_y=0,-12
        [/frame]
        {SOUND:HIT_AND_MISS magic-dark.ogg magic-dark-miss.ogg -100}
        [frame]
            image="units/silan.png:50"
        [/frame]
        [frame]
            duration=60
            image="units/silan.png"
        [/frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=shadow wave
        [/filter_attack]

        {MISSILE_FRAME_SHADOW_WAVE}

        start_time=-700
        [frame]
            image="units/silan.png:25"
        [/frame]
        [frame]
            image="units/silan.png:[35,75,15]"
        [/frame]
        [frame]
            image="units/silan.png"
            halo=halo/undead/dark-magic-[1~6].png:50
            halo_x,halo_y=0,-12~12
        [/frame]
        [frame]
            image="units/silan.png:350"
        [/frame]
        {SOUND:HIT_AND_MISS magic-dark-big.ogg magic-dark-big-miss.ogg -50}
        [frame]
            image="units/silan.png:50"
        [/frame]
        [frame]
            duration=50
            image="units/silan.png"
        [/frame]
    [/attack_anim]

    [recruiting_anim]
        [filter_second]
            race=undead
        [/filter_second]
        start_time=-450
        [frame]
            image="units/silan.png:30"
        [/frame]
        [frame]
            image="units/silan.png:[35,75,20]"
        [/frame]
        [frame]
            image="units/silan.png"
            halo=halo/undead/dark-magic-[1~6].png:50
            halo_x,halo_y=0,-12
        [/frame]
        sound_start_time=-40
        [sound_frame]
            sound=magic-dark.ogg
        [/sound_frame]
        [frame]
            image="units/silan.png:[50,40]"
        [/frame]
        [frame]
            image="units/silan.png:10"
        [/frame]
    [/recruiting_anim]
[/unit_type]
