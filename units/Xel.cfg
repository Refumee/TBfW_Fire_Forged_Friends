#textdomain wesnoth-units
[unit_type]
    id=Xel
    name= _ "female^Saurian Skirmisher"
    race=lizard
    gender=male
    image="units/xel.png"
    profile=portraits/xel.webp
    hitpoints=28
    movement_type=lizard
    movement=6
    experience=32
    level=1
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=15
    usage=scout
    description= _ "A saurian runaway from far east, bearing scars and shackled as a reminder of whatever abuse he used to face in his homeland. A capable, opportunistic, but slightly cowardly warrior.."
    die_sound=hiss-die.wav
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]

    [attack]
        name=dagger
#textdomain wesnoth-units
        description= _ "dagger"
        icon=attacks/dagger-human.png
        type=blade
        range=melee
        damage=6
        number=2
		specials_list=backstab
    [/attack]

    [attack]
		name=chain
		description=_"chain"
		icon=attacks/chain.png
		range=melee
		type=impact
		damage=5
		number=2
		specials_list=magical
	[/attack]

    [attack]
        name=spear
        description=_"spear"
        range=ranged
        type=pierce
        damage=4
        number=2
        icon=attacks/spear-thrown.png
    [/attack]
	{DEFENSE_ANIM "units/xel.png" "units/xel.png" hiss-hit.wav }

    [attack_anim]
        [filter_attack]
            name=spear
            range=ranged
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            offset=-0.2~1.0
            image="projectiles/spear-n.png"
            image_diagonal="projectiles/spear-ne.png"
        [/missile_frame]

        start_time=-450
        throw_sound_start_time=-150
        sound_start_time=-100

        [throw_sound_frame]
            sound={SOUND_LIST:THROW}
        [/throw_sound_frame]

        [if]
            hits=yes
            [sound_frame]
                sound=spear.ogg
            [/sound_frame]
        [/if]
        [if]
            direction=s,se,sw
            [frame]
                image="units/xel.png:100"
            [/frame]
        [/if]
        [else]
            direction=n,ne,nw
            [frame]
                image="units/xel.png:100"
            [/frame]
        [/else]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
		start_time=-350
        [frame]
            image="units/xel.png:150"
        [/frame]
		[frame]
            image="units/xel.png:200"
        [/frame]
		{SOUND:HIT_AND_MISS dagger-swish.wav {SOUND_LIST:MISS} -125}
	    [frame]
            image="units/xel:200"
        [/frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=chain
        [/filter_attack]

        start_time=-250
        {SOUND:HIT_AND_MISS flail.ogg flail-miss.ogg -250}
        [frame]
            image="units/xel.png:100"
        [/frame]
        [frame]
            image="units/xel.png:[100*4]"
        [/frame]
    [/attack_anim]
[/unit_type]
