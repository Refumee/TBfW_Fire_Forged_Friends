#textdomain wesnoth-units
[unit_type]
    id=Cheska
    name= _ "Swordsman"
    race=human
    image="units/cheska.png"
    profile="portraits/cheska.webp"
    hitpoints=55
    movement_type=armoredfoot
    movement=5
    experience=80
    level=2
    alignment=lawful
    advances_to=Royal Guard
    cost=29
    usage=fighter
    description= _ "Young, smart, tough female commander. Wears heavy armor and carries heavy weaponry, very much against the norm of female warriors."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/cheska.png" "units/cheska.png" {SOUND_LIST:HUMAN_HIT} }
	
	{LEADING_ANIM "units/cheska_leadership.png" "units/cheska_leadership.png" -5,-28}
    abilities_list=leadership

    [attack]
        name=sword
        description=_"sword"
        icon=attacks/sword-human.png
        type=blade
        range=melee
        damage=16
        number=2
    [/attack]
	
    [attack]
        name=crossbow
        description=_"crossbow"
        icon=attacks/crossbow-human.png
        type=pierce
        range=ranged
        damage=7
        number=2
    [/attack]

    [attack_anim]
        [filter_attack]
            name=crossbow
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        start_time=-400
        [frame]
            image="units/cheska.png:100"
        [/frame]
        {SOUND:HIT_AND_MISS crossbow.ogg crossbow-miss.ogg -300}
        [frame]
            image="units/cheska.png:150"
        [/frame]
        [frame]
            image="units/cheska.png:300"
        [/frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-600
        offset=0.0:300,0.0~0.6:200,0.6:50,0.6~0.0:300
        [frame]
            image="units/cheska.png:[100*8]"
        [/frame]
        [frame]
            image="units/cheska.png:50"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]
[/unit_type]
