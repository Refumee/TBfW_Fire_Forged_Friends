#textdomain wesnoth-fff

# New traits:

#define TRAIT_SHACKLED
    # Units with trait Shackled get a -1 to ranged damage.
    [trait]
        id=shackled
        male_name= _ "shackled"
        female_name= _ "female^shackled"
        help_text= _ "<italic>text='Shackled'</italic> units do 1 less damage for every successful strike in ranged combat."
        [effect]
            apply_to=attack
            range=ranged
            increase_damage=-1
        [/effect]
    [/trait]
#enddef
