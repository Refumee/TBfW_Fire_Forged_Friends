#textdomain wesnoth-fff

# Macros that help manage events.

#define FIRE_EVENT_NEXT_SIDE_TURN EVENT_NAME SIDE_NUMBER WHEN_TO_FIRE
    # This macro fires the named event once when side SIDE_NUMBER gets to go.
    # WHEN_TO_FIRE should either be "turn refresh" or "side turn"
    [event]
        name={WHEN_TO_FIRE}
        first_time_only=no
        [if]
            [not]
                [variable]
                    name=fired_event_{EVENT_NAME}_{SIDE_NUMBER}
                    boolean_equals=yes
                [/variable]
            [/not]
            [and]
                [variable]
                    name=side_number
                    equals={SIDE_NUMBER}
                [/variable]
            [/and]
            [then]
                [fire_event]
                    name={EVENT_NAME}
                [/fire_event]
                [set_variable]
                    name=fired_event_{EVENT_NAME}_{SIDE_NUMBER}
                    value=yes
                [/set_variable]
            [/then]
        [/if]
    [/event]
    [event]
        name=victory,defeat
        [clear_variable]
            name=fired_event_{EVENT_NAME}_{SIDE_NUMBER}
        [/clear_variable]
    [/event]
#enddef

#define FFF_TC_COLORING SIDE WML COLOR
	[event]
        id=fff_tc_coloring_{SIDE}_{COLOR}
        name=unit placed
        first_time_only=no
		
		[filter]
			side={SIDE}
            {WML}
        [/filter]
		
		[object]
			[effect]
				apply_to=image_mod
				add=RC(magenta>{COLOR})
			[/effect]
		[/object]
    [/event]
#enddef