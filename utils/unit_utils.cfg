#define FFF_TC_COLORING SIDE WML COLOR
	[event]
        id=fff_tc_coloring_{SIDE}_{WML}{COLOR}
        name=recruit
        first_time_only=no
		
		[filter]
			side={SIDE}
            {WML}
        [/filter]
		
		[object]
			[effect]
				apply_to=image_mod
				add=RC(magenta>{COLOR})
			[/effect]
		[/object]
    [/event]
#enddef

#define UNIT_TC_COLORING SIDE TYPE X Y COLOR
    # Meant to be used as a suffix to a unit-generating macro call.
    [unit]
        side={SIDE}
        type={TYPE}
        x={X}
        y={Y}
		[object]
			[filter]
				x,y={X},{Y}
			[/filter]
			[effect]
				apply_to=image_mod
				add=RC(magenta>{COLOR})
			[/effect]
		[/object]
    [/unit]
#enddef