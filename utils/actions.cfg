#textdomain wesnoth-fff

# Macros that accomplish direct actions on the game state.

#define SET_DESTINATION FILTER X Y
    # Sets the moveto destination for units matching the filter.
    [store_unit]
        variable=set_destination_units
        [filter]
            {FILTER}
            [and]
                [not]
                    x=recall
                [/not]
            [/and]
        [/filter]
    [/store_unit]
    {FOREACH set_destination_units destination_units_index}
        [set_variable]
            name=set_destination_units[$destination_units_index].goto_x
            value={X}
        [/set_variable]
        [set_variable]
            name=set_destination_units[$destination_units_index].goto_y
            value={Y}
        [/set_variable]
        [unstore_unit]
            variable=set_destination_units[$destination_units_index]
            find_vacant=no
        [/unstore_unit]
#        [message]
#            speaker=narrator
#            message="Forcing a unit to goto ({X}, {Y}) (the $destination_units_index|th unit)."
#        [/message]
    {NEXT destination_units_index}
    [clear_variable]
        name=set_destination_units
    [/clear_variable]
#enddef

#define SET_PROPERTY FILTER PROPERTY VALUE
    # Sets any single-value property of the filtered unit(s). Unlike
    # MODIFY_UNIT, this macro allows a variable as the PROPERTY argument.
    [store_unit]
        variable=set_property_units
        [filter]
            {FILTER}
        [/filter]
    [/store_unit]
    [set_variable]
        name=property_to_set
        value={PROPERTY}
    [/set_variable]
    {FOREACH set_property_units set_property_units_index}
        [set_variable]
            name=set_property_units[$set_property_units_index].$property_to_set
            value={VALUE}
        [/set_variable]
        [if]
            [variable]
                name=set_property_units[$set_property_units_index].x
                equals=recall
            [/variable]
            [then]
                [kill]
                    id=$set_property_units[$($set_property_units_index)].id
                    animate=no
                    fire_event=no
                [/kill]
            [/then]
        [/if]
        [unstore_unit]
            variable=set_property_units[$set_property_units_index]
            find_vacant=no
        [/unstore_unit]
#        [message]
#            speaker=narrator
#            message="Setting property {PROPERTY} on a unit to {VALUE}."
#        [/message]
    {NEXT set_property_units_index}
    [clear_variable]
        name=set_property_units
    [/clear_variable]
#enddef

#define CLEAR_PROPERTY FILTER PROPERTY
    # Clears any single-value property of the filtered unit(s). Unlike
    # MODIFY_UNIT, this macro allows a variable as the PROPERTY argument.
    [store_unit]
        variable=clear_property_units
        [filter]
            {FILTER}
        [/filter]
    [/store_unit]
    [set_variable]
        name=property_to_clear
        value={PROPERTY}
    [/set_variable]
    {FOREACH clear_property_units clear_property_units_index}
        [clear_variable]
            name=clear_property_units[$clear_property_units_index].$property_to_clear
        [/clear_variable]
        [if]
            [variable]
                name=clear_property_units[$clear_property_units_index].x
                equals=recall
            [/variable]
            [then]
                [kill]
                    id=$clear_property_units[$($clear_property_units_index)].id
                    animate=no
                    fire_event=no
                [/kill]
            [/then]
        [/if]
        [unstore_unit]
            variable=clear_property_units[$clear_property_units_index]
            find_vacant=no
        [/unstore_unit]
#        [message]
#            speaker=narrator
#            message="Clearing property {PROPERTY} on a unit."
#        [/message]
    {NEXT clear_property_units_index}
    [clear_variable]
        name=clear_property_units
    [/clear_variable]
#enddef

#define MOVE_TO FILTER X Y CONDITION
    # Moves a unit to an empty space near (X, Y) (or to (X, Y) if possible).
    # Ignores zones of control. Just like MOVE_UNIT, except doesn't glitch the
    # movement animation when X,Y is occupied. The destination will satisfy
    # CONDITION (a standard location filter), even if (X, Y) doesn't.
    [store_unit]
        variable=move_to_units
        [filter]
            {FILTER}
            [and]
                [not]
                    x=recall
                [/not]
            [/and]
        [/filter]
    [/store_unit]
    {FOREACH move_to_units move_to_units_index}
        [set_variable]
            name=move_to_id
            to_variable=move_to_units[$move_to_units_index].id
        [/set_variable]
        [store_unit]
            variable=move_to_unit
            [filter]
                id=$move_to_id
            [/filter]
        [/store_unit]
        # Get the starting x and y values:
        [set_variable]
            name=start_x
            to_variable=move_to_unit.x
        [/set_variable]
        [set_variable]
            name=start_y
            to_variable=move_to_unit.y
        [/set_variable]
        # Find an open space near the destination:
        {FIND_NEARBY ([not]
                          [filter]
                          [/filter]
                      [/not]
                      [and]
                          {CONDITION}
                      [/and]) {X} {Y} 30}
        # Set real coordinates and end position:
        [set_variable]
            name=move_to_unit.x
            to_variable=nearby_locations[0].x
        [/set_variable]
        [set_variable]
            name=move_to_unit.y
            to_variable=nearby_locations[0].y
        [/set_variable]
        [clear_variable]
            name=nearby_locations
        [/clear_variable]
        [hide_unit]
            x,y=move_to_unit.x,move_to_unit.y
        [/hide_unit]
        [set_variable]
            name=end_x
            to_variable=move_to_unit.x
        [/set_variable]
        [set_variable]
            name=end_y
            to_variable=move_to_unit.y
        [/set_variable]
        # Determine new facing for the unit:
        [set_variable]
            name=move_to_unit.facing
            format=$(if(start_x < end_x, se, sw))
        [/set_variable]
#        [message]
#            speaker=narrator
#            message="Moving unit $move_to_unit.id with type $move_to_unit.type from ($start_x, $start_y) to ($end_x, $end_y)."
#        [/message]
        # Scroll to the old location:
        [scroll_to]
            x=$start_x
            y=$start_y
        [/scroll_to]
        # Erase the old unit:
        [kill]
            id=$move_to_id
            animate=no
            fire_event=no
        [/kill]
        # Move the fake unit:
        [move_unit_fake]
            type=$move_to_unit.type
            gender=$move_to_unit.gender
            variation=$move_to_unit.variation
            side=$move_to_unit.side
            x=$start_x,$end_x
            y=$start_y,$end_y
        [/move_unit_fake]
        # Place the real unit:
        [unstore_unit]
            variable=move_to_unit
            find_vacant=yes
        [/unstore_unit]
        [redraw]
        [/redraw]
    {NEXT move_to_units_index}
    [clear_variable]
        name=move_to_units, move_to_unit, move_to_id, start_x, start_y, end_x, end_y
    [/clear_variable]
#enddef

#define MAKE_TROOPS_LOYAL
    # This macro makes all troops on the recall list into fake-loyal units:
    # they still have whatever traits they had before, but cost no upkeep.
    [store_unit]
        variable=make_troops_loyal_units
        [filter]
            x,y=recall,recall
        [/filter]
    [/store_unit]
    {FOREACH make_troops_loyal_units make_troops_loyal_units_index}
        [set_variable]
            name=make_troops_loyal_units[$make_troops_loyal_units_index].upkeep
            value=loyal
        [/set_variable]
        [kill]
            id=$make_troops_loyal_units[$($make_troops_loyal_units_index)].id
            animate=no
            fire_event=no
        [/kill]
        [unstore_unit]
            variable=make_troops_loyal_units[$make_troops_loyal_units_index]
            find_vacant=no
        [/unstore_unit]
    {NEXT make_troops_loyal_units_index}
    [clear_variable]
        name=make_troops_loyal_units
    [/clear_variable]
#enddef

#define UNLOAD_UNITS VARIABLE X Y
    # Unloads units from a transport (or places them for some other purpose):
    [set_variable]
        name=unload_units_units
        value={VARIABLE}
    [/set_variable]
    {FOREACH $unload_units_units unload_units_index}
        [unstore_unit]
            variable=$unload_units_units|[$unload_units_index]
            x,y={X},{Y}
            find_vacant=yes
        [/unstore_unit]
    {NEXT unload_units_index}
    [clear_variable]
        name=unload_units_units
    [/clear_variable]
#enddef

#define GENERIC_UNIT_EXP SIDE TYPE X Y EXP
    # Creates a new unit on the given SIDE of type TYPE and with EXP
    # experience. The unit is placed at X,Y, which can be "recall,recall" if
    # so desired.
    [unit]
        side={SIDE}
        type={TYPE}
        x,y={X},{Y}
        generate_name=yes
        random_gender=yes
        random_traits=yes
        experience={EXP}
    [/unit]
#enddef

#define GENERIC_UNIT_SAFE SIDE TYPE X Y CONDITION
    # Works just like GENERIC_UNIT but picks the nearest empty space to the
    # space designated, and allows an extra CONDITION to be placed on the kind
    # of space found. Search for a suitable space is limited to a 30-hex
    # radius, after which the whole map is considered. Note: do not use this
    # macro in a [side] tag, as it will crash the game, because the map isn't
    # searchable while sides are being defined.
    {FIND_NEARBY ([not]
                      [filter]
                      [/filter]
                  [/not]
                  [and]
                      {CONDITION}
                  [/and]) {X} {Y} 30}
    {DEBUG ("Condition: {CONDITION}. Location found: $nearby_locations[0].x, $nearby_locations[0].y")}
    {GENERIC_UNIT {SIDE} {TYPE} $nearby_locations[0].x $nearby_locations[0].y}
#enddef

#define GENERIC_UNIT_EXP_SAFE SIDE TYPE X Y EXP CONDITION
    # Works just like GENERIC_UNIT_EXP but picks the nearest empty space to the
    # space designated, and allows an extra CONDITION to be placed on the kind
    # of space found. Search for a suitable space is limited to a 30-hex
    # radius, after which the whole map is considered. Note: do not use this
    # macro in a [side] tag, as it will crash the game, because the map isn't
    # searchable while sides are being defined.
    {FIND_NEARBY ([not]
                      [filter]
                      [/filter]
                  [/not]
                  [and]
                      {CONDITION}
                  [/and]) {X} {Y} 30}
    {DEBUG ("Condition: {CONDITION}. Location found: $nearby_locations[0].x, $nearby_locations[0].y")}
    {GENERIC_UNIT_EXP {SIDE} {TYPE} $nearby_locations[0].x $nearby_locations[0].y {EXP}}
#enddef

#define REFRESH_UNITS VARIABLE
    # Refreshes units stored in a variable.
    {FOREACH {VARIABLE} refresh_units_index}
        [set_variable]
            name={VARIABLE}[$refresh_units_index].hitpoints
            value=${VARIABLE}[$refresh_units_index].max_hitpoints
        [/set_variable]
        [set_variable]
            name={VARIABLE}[$refresh_units_index].moves
            value=${VARIABLE}[$refresh_units_index].movement
        [/set_variable]
        [set_variable]
            name={VARIABLE}[$refresh_units_index].attacks_left
            value=${VARIABLE}[$refresh_units_index].max_attacks
        [/set_variable]
    {NEXT refresh_units_index}
    [clear_variable]
        name=refresh_units_units
    [/clear_variable]
#enddef

#define EXIT_STAGE_RECALL FILTER X Y
    # Moves a unit matching the filter to X,Y, at which point it takes them
    # off of the map and puts them on the recall list. Doesn't work for more
    # than one unit at once.
    {MOVE_TO {FILTER} {X} {Y} ()}
    [store_unit]
        variable=exit_stage_recall_unit
        kill=yes
        [filter]
            {FILTER}
        [/filter]
    [/store_unit]
    [unstore_unit]
        variable=exit_stage_recall_unit
        x,y=recall,recall
    [/unstore_unit]
    [clear_variable]
        name=exit_stage_recall_unit
    [/clear_variable]
#enddef
