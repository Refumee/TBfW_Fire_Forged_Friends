#textdomain wesnoth-fff

# Macros that perform search-like functions.

#define FIND_NEARBY FILTER X Y LIMIT
    # Does a search for a nearby location that matches the given filter.
    # Basically just looks for such a location with increasing radius until it
    # finds at least one. This is sadly inefficient, but implementing BFS in
    # WML is... difficult. Once LIMIT is reached, the entire map is searched.
    [clear_variable]
        name=nearby_locations
    [/clear_variable]
    [set_variable]
        name=depth
        value=0
    [/set_variable]
    [while]
        [variable]
            name=nearby_locations.length
            equals=0
        [/variable]
        [and]
            [variable]
                name=depth
                less_than={LIMIT}
            [/variable]
        [/and]
        [do]
#            [message]
#                speaker=narrator
#                message="Searching depth $depth around ({X}, {Y})..."
#            [/message]
            [store_locations]
                variable=nearby_locations
                {FILTER}
                [and]
                    x,y={X},{Y}
                    radius=$depth
                [/and]
            [/store_locations]
#            [message]
#                speaker=narrator
#                message="...found $nearby_locations.length locations."
#            [/message]
            [set_variable]
                name=depth
                add=1
            [/set_variable]
        [/do]
    [/while]
    [if]
        [variable]
            name=nearby_locations.length
            equals=0
        [/variable]
        [then]
            [store_locations]
                variable=nearby_locations
                {FILTER}
            [/store_locations]
        [/then]
    [/if]
    [clear_variable]
        name=depth
    [/clear_variable]
#enddef
