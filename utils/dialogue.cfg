#textdomain wesnoth-fff

# Macros that deal with speaking and cutscenes.

#define M FILTER MESSAGE
    [message]
        {FILTER}
        message={MESSAGE}
    [/message]
#enddef

# Message for Offmap units
#define M_OFFMAP IMAGE NAME MESSAGE
    [message]
        image={IMAGE}
		caption={NAME}
        message={MESSAGE}
    [/message]
#enddef