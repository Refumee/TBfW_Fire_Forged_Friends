[campaign]
    id=Fire-Forged_Friends
    name= _"Fire-Forged Friends"
    abbrev=_"FFF"
    define=CAMPAIGN_FIRE_FORGED_FRIENDS

    icon="data/add-ons/Fire_Forged_Friends/images/campaign_image.png"
    first_scenario=01_like_rats_in_a_cage
	{ENABLE_SAURIAN_SPEARTHROWER}
	
    {CAMPAIGN_DIFFICULTY EASY "data/add-ons/Fire_Forged_Friends/images/campaign_image_easy.png" ( _ "Pups") ( _ "Easy")}
    {CAMPAIGN_DIFFICULTY NORMAL "data/add-ons/Fire_Forged_Friends/images/campaign_image_normal.png" ( _ "Rats") ( _ "Normal")} {DEFAULT_DIFFICULTY}
    {CAMPAIGN_DIFFICULTY HARD "data/add-ons/Fire_Forged_Friends/images/campaign_image.png" ( _ "A-Team") ( _ "Hard")}

    image="data/add-ons/Fire_Forged_Friends/images/campaign_image.png~SCALE_SHARP(288,288)"
    description= _ "Few things under the sun can unite squabbling foes as fast as a common enemy.

Follow three heroes who form a peculiar alliance to break out of a cage that none of them could open by themselves, who are then quickly thrown into a great adventure unlike anything they expected...

(Intermediate level, 1/~20 scenarios.)"

    [about]
        title=_"Campaign Design"
