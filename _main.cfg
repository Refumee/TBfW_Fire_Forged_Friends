    {CAMPAIGN_DIFFICULTY HARD "units/saurians/flanker/flanker.png~RC(magenta>green)" ( _ "Flanker") ( _ "Hard")}

    image="portraits/saurians/skirmisher.png"
    description= _ "Few things under the sun can unite squabbling foes as fast as a common enemy.

Follow three heroes who form a peculiar alliance to break out of a cage that none of them could open by themselves, who are then quickly thrown into a great adventure unlike anything they expected...

(Intermediate level, 1/~20 scenarios.)"

