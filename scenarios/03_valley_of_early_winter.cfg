#textdomain wesnoth-fff
# TODO: Custom units for Cheska, Xel, Silan
# TODO: Turns/gold balancing
# TODO: Extra guards?
# TODO: What about player gold (for all three factions)?
[scenario]
    id="03_valley_of_early_winter"
    next_scenario=04_the_day_the_autumn_came_back

    name=_"Valley Of Early Winter"
	map_file=~add-ons/Fire_Forged_Friends/maps/03_valley_of_early_winter.map
    victory_when_enemies_defeated=no

    {TURNS -1 -1 -1}

    {DEFAULT_SCHEDULE}

    {MOOD_DOOM}

    #################
    ### The Story ###
    #################
    [story]
        [part]
            story=_ "And so it came to be that this city, and especially the abandoned fortress, became their base of operations, from which they ran several counter-raids against the orcish forces, helped defending some more nearby cities, and spent their free time repairing the fortress and training recruited citizens. Weeks passed."
        [/part]
        [part]
            story=_ "Cheska sent further messages to the inner country, detailing her struggle against the orcs, hearing news about the battle elsewhere as well as eventually gaining some reinforcements. These, unfortunately, were not as accustomed to the presence of a necromancer, forcing Silan to relocate his own business lest he would bring unwanted attention towards him and his companions. As Silan left north to deal with some disturbance among elves living there, Cheska and Xel sailed east, upriver, in order to investigate rumours of undead activities thereat."
        [/part]
        [part]
            story=_ "The first snowflakes were falling, as fall was bringing way to winter..."
        [/part]
    [/story]

    ###################
    ### Player Side ###
    ###################
	# Cheska is TC green
	# Silan is TC White
	# Xel is TC Red, Xel, meanwhile, managed to hire services of whatever was left of Gak's mercenary group, allowing him to recruit drake fighters and gliders.
    [side]
        side=1
        controller=human

        persistent=yes
        save_id=Cheska

        team_name=rats
        user_team_name=_"Cheska's Company"

        color=green

        no_leader=yes # See [unit] tag below for leader

        recruit=Spearman,Horseman,Bowman,Cavalryman,Mage,Saurian Skirmisher,Saurian Augur #Cavalryman and Mage are new

        {GOLD 150 120 90}
		
		shroud=yes
		fog=yes

        [unit]
            id=Cheska
            type=Captain
            name=_"Cheska"
            unrenamable=yes
            gender=female
            random_traits=no
            canrecruit=yes
            x,y=1,1
        [/unit]
    [/side]

    ####################
    ### Enemy Side 1 ###
    ####################
	#Undead
    [side]
        side=2
        color=black
        controller=ai
        team_name=undead
        type=Death Knight #some undead lord
        id=DK
        canrecruit=yes
        recruit=""
        {GOLD 100 200 300}
		[ai]
			[avoid]
				x,y=28,8 #avoid the white mages hut
			[/avoid]
		[/ai]
    [/side]


    ##############
    ### Setup: ###
    ##############
    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Investigate the valley."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska or Xel."
            [/objective]
        [/objectives]

        [store_unit]
            [filter]
                id=Cheska
            [/filter]

            kill=yes
            variable=stored_Cheska
        [/store_unit]

        [store_unit]
            [filter]
                id=Silan
            [/filter]

            kill=yes
            variable=stored_Silan
        [/store_unit]
		
		{UNIT 2 ("Ghost") 43 13 ()}
		{UNIT 2 ("Ghost") 40 6 ()}
		{UNIT 2 ("Skeleton") 34 10 ()}
		{UNIT 2 ("Skeleton") 33 4 ()}
		{UNIT 2 ("Skeleton Archer") 26 11 ()}
		{UNIT 2 ("Skeleton") 37 7 ()}
		{UNIT 2 ("Skeleton Archer") 42 8 ()}

        [micro_ai]
            side=2
            ai_type=forest_animals
            action=add
			deer_type=Skeleton,Skeleton Archer,Ghost
            [filter_location]
				[not]
					x,y=28,8
				[/not]
            [/filter_location]

        [/micro_ai]
		
        [capture_village]
            side=2
            terrain=*^V*
			[not]
				x,y=28,8
			[/not]
        [/capture_village]
		
    [/event]

    ####################
    ### Start event: ###
    ####################

    [event]
        name=start
		
		[capture_village]
			side=0
			x,y=28,8
		[/capture_village]
		#Imagine a thick fog covering this whole map and obstructing your view. Then imagine you could see through the fog, that the whole place is pretty full of all kinds of undead. Gets pretty confusing, huh?
		
		#This mission begins with a ship arriving from the west, unloading Cheska, Xel, and what named characters still are alive within your party. They set a base camp upon the place shown on the map.
		{UNIT 1 ("Merchant Carrack") 1 7 id=Ship}
		[redraw]
			clear_shroud=yes
		[/redraw]
		{MOVE_UNIT id=Ship 5 8 }

        [move_unit_fake]
            side=1
            type=$stored_Cheska.type
            x=5,6
            y=8,7
        [/move_unit_fake]
		
        [unstore_unit]
            variable=stored_Cheska
			x,y=6,7
        [/unstore_unit]
		[redraw]
			clear_shroud=yes
		[/redraw]

		{MOVE_UNIT id=Ship 1 7 }
		[kill]
			id=Ship
		[/kill]
		
		{MOVE_UNIT id=Cheska 10 8 }

		[redraw]
			clear_shroud=yes
		[/redraw]

		{BUILD_CAMP Ke 10 8}
		{BUILD_CAMP Ce 9 8}
		{BUILD_CAMP Ce 9 9}
		{BUILD_CAMP Ce 10 9}
		{BUILD_CAMP Ce 11 9}
		{BUILD_CAMP Ce 11 8}
		{BUILD_CAMP Ce 10 7}
		
		[recall]
			id=Elric
		[/recall]
		[recall]
			id=Xel
		[/recall]
		[recall]
			id=Zeza
		[/recall]

        [fire_event]
            name=intro_dialogue
        [/fire_event]
    [/event]

    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue
		{M id=Cheska ( _ "Now this is peculiar. It's... not supposed to be quite this cold yet, at the time of the year.")}
		{M id=Xel ( _ "At the time of the year? Are you saying... for your country, at some point of the year, this kind of weather is normal?")}
		{M id=Cheska ( _ "Actually, I'm afraid it will get even worse.")}
		{M id=Xel ( _ "...I think me and my people might need some warmer clothing.")}
		{M id=Xel ( _ "Still, you mentioned such cold weather was not normal this early.")}
		{M id=Cheska ( _ "Yes.")}
		{M id=Xel ( _ "Any ideas?")}
		{M id=Cheska ( _ "When enough mages with sufficient power and knowledge get together and make some deliberate attempt, they are capable of bending, slightly, the weather conditions around them. Usually that would mean necromancers creating winter: it has been known to happen, once or twice in the history of Wesnoth.")}
		{M id=Xel ( _ "...Or it might just be of abnormal weather.")}
		{M id=Cheska ( _ "I admire your optimism.")}
		{M id=Xel ( _ "I'm simply observing all possibilities of the situation.")}

        {CUE_EPIC}
        {MOOD_EPIC}
    [/event]
	
    [event]
        name=sighted #As soon as it does become clear there is undead there (i.e. when one is seen), dialogue follows:

		[filter]
			side=2
		[/filter]
		[filter_second]
			side=1
		[/filter_second]

		{M id=Xel ( _ "All right, so the valley is infested with living dead. I suppose it was rather obvious, in hindsight.")}
		{M id=Cheska ( _ "Indeed. Our duty is now clear: we must clear the path of any trace of undead or necromancer filth, then press on forwards.")}
		{M id=Xel ( _ "Roger that. I only wish it was warmer...")}
		
		[set_recruit]
			side=2
			recruit="Skeleton,Skeleton Archer,Ghost"
		[/set_recruit]

        [micro_ai]
            side=2
            ai_type=forest_animals
            action=delete
        [/micro_ai]

        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Defeat the Undead Leader."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska or Xel."
            [/objective]
        [/objectives]
    [/event]
	
	[event]
		name=capture
		first_time_only=yes

        [filter]
            side=1
            x,y=28,8
        [/filter]

        [unit]
            type=White Mage
            side=1
            id=Dorothy
            name= _"White Mage"
            gender=female
            random_traits=no
            x,y=28,8
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_RESILIENT}
            [/modifications]
            [event]
                name=last breath
                [filter]
                    id=Dorothy
                [/filter]
                {M id=Dorothy ( _ "I... I can see the light. You shall not be following me.")}
            [/event]
        [/unit]

		{M id=Dorothy ( _ "Who is it out there now? More of the accursed undead?")}
		{M id=Cheska ( _ "No, ma'am. We are quite alive and well. My name is Cheska Kuhral, and this is my associate, Xel.")}
		{M id=Xel ( _ "Hello.")}
		{M id=Cheska ( _ "We are here, initially, to investigate some strange rumours concerning the place as of late: once those rumours turned out to be completely true, our task turned into that of purging the valley of necromancers.")}
		{M id=Dorothy ( _ "And I am Dorothy Salminen, the resident retired white mage of the area. It is a pleasure to make acquaintance with you all, and I wish you best of luck. I might have dealt with the problem myself, if I was a few decades younger, but with my age, unfortunately, I am barely enough to defend my own cottage.")}
		
		{MODIFY_UNIT (id=Dorothy) name ( _ "Dorothy")}
		
		{M id=Xel ( _ "Impressive work, even so, from an old woman such as you. No offense or anything.")}
		{M id=Dorothy ( _ "None taken.")}
		{M id=Cheska ( _ "Well, the issue was that you were all alone, was it not? Even if you were no match to the legions of the undead alone, I believe you would still be significant aid to us. Would you consider lending us your aid?")}
		{M id=Dorothy ( _ "It would be a pleasure.")}
		{M id=Cheska ( _ "Much appreciated.")}
	[/event]

    [event]
        name=die
        [filter]
            id=DK #Death Knight
        [/filter]
        [endlevel]
            result=victory
        [/endlevel]
    [/event]

    [event]
        name=victory

		{M id=Xel ( _ "Ah-choo! (Sneeze) Oh, wonderful.")}
		{M id=Cheska ( _ "Are you sure you will be all right?")}
		{M id=Xel ( _ "Just a bit of cold I caught. I'll be fine.")}
		{M id=Cheska ( _ "No, really... it might develop into something nasty. You should probably head back to camp and get some rest.")}
		{M id=Xel ( _ "I told you, I'll be fi- and no cuddling! (Cough)")}
		{M id=Cheska ( _ "...What? I was not going to cuddle you.")}
		{M id=Xel ( _ "I saw it in your eyes. You think I'm a cute little lizard who has- (Sneeze) who has gotten ill and requires your care and affection. Well let me tell you I'm not! I am a warrior, and such thoughts are demeaning to my status!")}
		{M id=Cheska ( _ "Forgive me. I did not intend you to think that way of me. I was merely trying to help.")}
		{M id=Xel ( _ "...")}
		{M id=Cheska ( _ "Would you at least accept this blanket, to help keep you warm? No unfortunate implications attached.")}
		{M id=Xel ( _ "...(Muttering) I suppose.")}

		#The following dialogue will only occur if Dorothy the white mage is still alive
		[if]
			[have_unit]
				id=Dorothy
			[/have_unit]
			[then]
				{M id=Xel ( _ "...Why are you looking at me like that? (Sniff)")}
				{M id=Dorothy ( _ "Oh, do pardon my manners. It is simply that I do not often see saurians in these parts, especially at winter, especially accompanying a human army.")}
				{M id=Xel ( _ "You do see a lot of weird things in this world, right?")}
				{M id=Dorothy ( _ "Indeed.")}
				{M id=Xel ( _ "Say, could you possibl- (hack) possibly be capable of doing something for this condition I'm in?")}
				{M id=Dorothy ( _ "I am afraid not. A common cold is simply one of those nuisances every human - and saurian - must occasionally endure. I can perhaps protect you from developing anything worse, or make some tea, but that is all the help you can expect from me.")}
				{M id=Xel ( _ "...Well, bummer.")}
				{M id=Cheska ( _ "Ma'am, if you intend to accompany me on my travels out of your home, then I feel there is something you should know, about a companion of mine...")}
				{M id=Dorothy ( _ "Indeed? Is this one as curious as your lizard friend?")}
				{M id=Cheska ( _ "He is a necromancer.")}
				{M id=Dorothy ( _ "...I beg your pardon?")}
				{M id=Xel ( _ "Just like you heard (sniffle). He isn't that bad of a guy, all things considered - he only uses orc bodies and- (hack) and doesn't seem to have much interest in taking over the country or anything.")}
				{M id=Cheska ( _ "I am still somewhat cautious of him myself, but I would not wish him to be smited by your righteous fury unless he deserved it. He has been a great help.")}
				{M id=Dorothy ( _ "Hmm. You travel with a saurian and what seems to be a necromancer of somewhat benevolent nature? I am most definitely going to continue my travels with you! This sounds interesting!")}
				{M id=Cheska ( _ "Is it just me, or did you just get younger?")}
				{M id=Dorothy ( _ "'Tis my desire for adventure that is renewing me!")}
				{M id=Cheska ( _ "...")}
				{M id=Cheska ( _ "...No, I do not believe this was the source of the cold - merely a forward outpost.")}
				{M id=Dorothy ( _ "It may have done its part in the freezing process, however, if only small.")}
			[/then]
			[else]
				{M id=Cheska ( _ "...")}
				{M id=Cheska ( _ "...No, I do not believe this was the source of the cold - merely a forward outpost.")}
				{M id=Xel ( _ "It may have done its part in the freezing process, however, if only small.")}
			[/else]
		[/if]
		{M id=Cheska ( _ "Indeed, but to discover the main culprit, we must press on further east. Onward!")}
    [/event]

    [event]
        name=die
        [filter]
            id=Xel
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

	{FFF_TC_COLORING 1 (race=lizard) red}

[/scenario]
