#textdomain wesnoth-fff
# TODO: Custom units for Cheska, Xel, Silan
# TODO: Turns/gold balancing
# TODO: Extra guards?
# TODO: What about player gold (for all three factions)?
[scenario]
    id="06_to_storm_the_fortress_atop_the_mountains"
    next_scenario=07_tracking_the_flying_lizard

    name=_"To Storm The Fortress Atop The Mountains"
	map_file=~add-ons/Fire_Forged_Friends/maps/06_to_storm_the_fortress_atop_the_mountains.map
    victory_when_enemies_defeated=no

    {TURNS -1 -1 -1}

    {DEFAULT_SCHEDULE}

    {MOOD_DOOM}

    #################
    ### The Story ###
    #################
    [story]
        [part]
            story=_ "Weeks passed as they fought against the tide of the orcs, and the occasional undead. Despite being separated, Cheska, Silan, and Xel all came to more or less the same conclusions about the matter: the orcs were numerous and everywhere, but lacked any focus and concentration of any organized battleforce, instead raiding and killing very much randomly. This made it relatively easy to push them back as well."
        [/part]
        [part]
            story=_ "It was quite a mystery, however, what had gotten them on the move in the first place. Orcs have always been a warlike race, and launched frequent raids to the surrounding civilizations, but this was something else entirely."
        [/part]
        [part]
            story=_ "Winter had settled in and covered all of Wesnoth in snow, when Silan was at last reunited with the rest of the party. They each had all followed the tracks of the orc activity on their own, finally discovering the location of their warcamp: despite being relatively independent and working separately, there was likely to be a bigger, nastier orc behind it all pulling the strings."
        [/part]
        [part]
            story=_ "Together once more, the three plan on assaulting the orcs and ending this war once and for all..."
        [/part]
		# The topmost base belongs to Silan, while the bottom one is Cheska's. Bottom-right - in the water - is a bunch of nagas, while every other base is occupied by orcs. The camp walls surrounding the mountain have orcs as well: they mostly stay where they are, at least until something comes close enough and it's a pretty smart move for them to go elsewhere. Curiously enough, the one in charge of the whole thing - the leader of the central camp, in the middle of the mountain - is not an orc at all, but an Armageddon Drake . His lackeys are all orcs, however.
    [/story]


    ###################
    ### Player Side ###
    ###################
	# Cheska is TC green
	# Silan is TC White
	# Xel is TC Red
    [side]
        side=1
        controller=human

        persistent=yes
        save_id=Cheska

        team_name=rats
        user_team_name=_"Cheska's Company"

        color=green

        no_leader=yes # See [unit] tag below for leader

        recruit=Spearman,Horseman,Bowman,Cavalryman,Mage,Saurian Skirmisher,Saurian Augur

        {GOLD 150 120 90}
    [/side]

    [side]
        side=2
        controller=human

        persistent=yes
        save_id=Silan

        team_name=rats
        user_team_name=_"Silan's dead folk"
        color=white

        no_leader=yes
		{GOLD 150 120 90}
    [/side]

    ####################
    ### Enemy Side 1 ###
    ####################
    [side]
        side=3
        color=teal
        controller=ai
        team_name=orcs
        type=Naga Sicarius
        id=Naga
        canrecruit=yes
        recruit=Naga Dirkfang,Naga Fighter,Naga Guard
        {GOLD 150 200 250}
    [/side]

    ####################
    ### Enemy Side 2 ###
    ####################
    [side]
        side=4
        color=brown
        controller=ai
        team_name=orcs
        type=Orcish Warrior
        id=Orc1
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
    [/side]

    ####################
    ### Enemy Side 3 ###
    ####################
    [side]
        side=5
        color=brown
        controller=ai
        team_name=orcs
        type=Orcish Warrior
        id=Orc2
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
    [/side]

    ####################
    ### Enemy Side 4 ###
    ####################
    [side]
        side=6
        color=black
        controller=ai
        team_name=orcs
        type=Armageddon Drake
        id=Galragoth
        name= _ "Galragoth"
        canrecruit=yes
        ecruit=Drake Burner,Drake Glider,Drake Fighter,Drake Clasher
        {GOLD 150 200 250}
    [/side]

    ##############
    ### Setup: ###
    ##############
    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Defeat Galragoth."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska, Silan, or Xel"
            [/objective]
        [/objectives]
		{CAPTURE_VILLAGES 3 39 43 5}
		{CAPTURE_VILLAGES 4 6 27 3}
		{CAPTURE_VILLAGES 5 28 14 5}
		{CAPTURE_VILLAGES 6 22 27 7}
		[recall]
			id=Cheska
			x,y=12,48
		[/recall]
		[recall]
			id=Silan
			x,y=13,1
		[/recall]

		[store_unit]
			[filter]
				race=lizard
			[/filter]
			variable=lizard_stored
			kill=yes
		[/store_unit]
    [/event]

    ####################
    ### Start event: ###
    ####################

    [event]
        name=start
		{MOVE_UNIT id=Cheska 22 40}
		#Cheskas Camp
		{BUILD_CAMP Kea 22 40}
		{BUILD_CAMP Cea 21 40}
		{BUILD_CAMP Cea 21 41}
		{BUILD_CAMP Cea 22 41}
		{BUILD_CAMP Cea 23 41}
		{BUILD_CAMP Cea 23 40}
		{BUILD_CAMP Cea 22 39}
		
		{MOVE_UNIT id=Silan 11 9}
		#Silans Camp
		{BUILD_CAMP Kerg 11 9}
		{BUILD_CAMP Cer 10 8}
		{BUILD_CAMP Cer 10 9}
		{BUILD_CAMP Cer 11 10}
		{BUILD_CAMP Cer 12 9}
		{BUILD_CAMP Cer 12 8}
		{BUILD_CAMP Cer 11 8}

        [fire_event]
            name=intro_dialogue
        [/fire_event]
    [/event]

    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue
		{M id=Silan ( _ "Cheska! How wonderful to see you again! It has been all too long!")}
		{M id=Cheska ( _ "...Likewise.")}
		{M id=Silan ( _ "You know, I was just watching for this place. I think it was very fortunate we met here: I probably could not have done this all alone.")}
		{M id=Cheska ( _ "Teaming up against a superior number of orcs for our own survival... Just like the old days, I suppose.")}
		{M id=Silan ( _ "Indeed, indeed! ...But where is Xel? I was hoping to meet him as well.")}
		{M id=Cheska ( _ "Xel took his saurians and a few sneaky humans, in an effort to sneak in to the base from the east. He is late, though: I hope anything hasn't happened.")}
		{M id=Silan ( _ "Speaking of their base. Did you notice the...?")}
		{M id=Cheska ( _ "I did.")}
		{M id=Orc1 ( _ "My lord, we are approached by a... strange combination of forces.")}
		{M id=Galragoth ( _ "Indeed? Would you care to elaborate this?")}
		{M id=Orc1 ( _ "Well... a necromancer with a bunch of undead from the north. And a human army, allied with a few drakes, from the south. We assume, my lord, that they are all here to bash our heads in.")}
		{M id=Galragoth ( _ "Yes, I believe this assumption might hold some truth in it. Prepare all forces for battle.")}
		{M id=Cheska ( _ "A drake...? How in blazes can a drake be in charge of an orc army?")}
		{M id=Silan ( _ "Beats me. I think it paid them money. A lot of money. Do you suppose it could be behind all this?")}
		{M id=Cheska ( _ "Perhaps, although the motivation is unclear. What I know of drakes - most of it from Xel and his henchmen - is that they are quite happy with what they have, and don't usually run around conquering other people's places.")}
		{M id=Silan ( _ "Further supported by the fact that we indeed don't see many drakes running around in here trying to conquer our place. Suppose you would like to go and ask why he is doing this?")}

        {CUE_EPIC}
        {MOOD_EPIC}
    [/event]

    [event]
		name=turn 10
		#On the tenth turn of conflict, Xel finally shows up. He appears to the mountains, straight east from the drake's base, along with him all the saurian veterans you have, as well as a few human rogues and outlaws. They're all in the player's control. Dialogue is triggered
		{UNIT 1 ("Rogue") 42 22 ()}
		{UNIT 1 ("Rogue") 41 21 ()}
		{UNIT 1 ("Outlaw") 42 23 ()}
		{UNIT 1 ("Bandit") 41 22 ()}

		[for]
			array=lizard_stored
			[do]
				[unstore_unit]
					variable=lizard_stored[$i]
					x,y=43,21
					find_vacant=yes
				[/unstore_unit]
			[/do]
		[/for]
		
		{M id=Xel ( _ "Sorry I'm late! Did I miss anything?")}
		{M id=Cheska ( _ "Xel! What kept you?")}
		{M id=Silan ( _ "Great to see you again, little guy!")}
		{M id=Xel ( _ "Hey, Silan is here! Nice to get back in touch with you, too.")}
		{M id=Galragoth ( _ "What is this? Saurians? How did they get past our lines?")}
		{M id=Grunt ( _ "I... don't know, my lord. Sneaky bunch, saurians, as I'm sure you already know. You want us to stop them?")}
		{M id=Galragoth ( _ "(Sarcastically) If you would be so kind...?")}
		{M id=Xel ( _ "Wait, what? How can they have...?")}
		{M id=Silan ( _ "Yes, we have been wondering the same thing. It's a... rather disturbing reveal, I think.")}
		{M id=Cheska ( _ "Whatever the case, we have more pressing matters to worry about right now. Onward, men!")}
    [/event]

    [event]
		#Once anyone, after this point, actually manages to hurt the mighty drake, some more dialogue will follow"
		name=attacker hits
		
		[filter]
			side=1,2
		[/filter]
		[filter_second]
			id=Galragoth
		[/filter_second]		
		{M id=Xel ( _ "Oi! Would you mind telling us what you are up to?")}
		{M id=Galragoth ( _ "I think not. You will warrant no villain's exposition from me.")}
    [/event]

    [event]
		#The battle is over when someone manages to injure Galragoth to less than 20 hit points. If the attack would have been enough to kill him, he's reduced to 1 HP instead.
		name=attack end
		
		[filter]
			side=1,2
		[/filter]
		[filter_second]
			id=Galragoth
		[/filter_second]
		
		[if]
			[have_unit]
				id=Galragoth
				formula="if(self.hitpoints <= 20)"
			[/have_unit]
			[then]
				[fire_event]
					name=victory
				[/fire_event]
			[/then]
		[/if]

    [/event]

    [event]
		#The battle is over when someone manages to injure Galragoth to less than twenty hit points. If the attack would have been enough to kill him, he's reduced to 1 HP instead.
        name=victory
		
		{M id=Galragoth ( _ "Enough!")}
		#His next attack - I haven't decided if it should be a gust of wind, a mighty stomp on ground that causes earthquakes, or a ring of fire - hurts everyone right next to him, friend or foe, and pushes them back a few steps.
		{M id=Galragoth ( _ "Fine. So you all have enough battle prowess to storm past my orc lackeys and seriously hurt me. Perhaps you can be a threat to me after all. But I must go now: I have wasted too much time, and I shall not die by your hand, not here.")}
		{M speaker=narrator ( _ "He spreads his wings.")}
		{M id=Cheska ( _ "Wait!")}
		{M id=Galragoth ( _ "Till we meet again!")}
		[store_unit]
			[filter]
				id="Galragoth"
			[/filter]
			variable=galragoth_stored
			kill=yes
		[/store_unit]
		[move_unit_fake]
			x=$galragoth_stored.x,45
			y=$galragoth_stored.y,20
			type="Armageddon Drake"
			side=6
		[/move_unit_fake]
		{M id=Silan ( _ "Well, that was certainly... interesting.")}
		{M id=Xel ( _ "The rest of the orcs have been routed: whatever was left of them pretty much surrendered as soon as they saw their chief chickening out.")}
		{M id=Cheska ( _ "What took you so long, anyway? I thought something might have happened.")}
		{M id=Xel ( _ "Oh, um... nothing much. Just a few orcs. Infiltrating can be tough... he-heh. Nice of you to worry for me, though.")}
		{M id=Cheska ( _ "Oh it's nothing.")}
		{M id=Silan ( _ "Enough with the small-talk: I think the big question is, why was a drake in charge of them to begin with? Should we find him and ask?")}
		{M id=Cheska ( _ "Probably explains why all the orcs were simultaneously so aggressive but also separate and uncoordinated, though: a member of another race in charge of them might be able to rouse and provoke them a bit, but not lead them all properly.")}
		{M id=Xel ( _ "I doubt it. Drakes of that magnitude hold a great deal of authority. He could easily have made them into an impressive and united battleforce if he wanted.")}
		{M id=Silan ( _ "Maybe he wasn't in charge after all?")}
		#The reaction to this is amused, although Xel's laughter is extremely uncomfortable.
		{M id=Cheska ( _ "Ha-ha, yeah right.")}
		{M id=Xel ( _ "Ha-ha...")}
		{M speaker=narrator ( _ "...")}
		{M id=Silan ( _ "Xel, is something wrong?")}
		{M id=Xel ( _ "...You are scaring me.")}
		{M id=Silan ( _ "How come?")}
		{M id=Xel ( _ "Because you make sense. And because if something can command such a mighty drake...")}
		{M id=Cheska ( _ "...then that something is a powerful force indeed.")}
    [/event]

    [event]
        name=die
        [filter]
            id=Silan,Xel,Cheska
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

	{FFF_TC_COLORING 1 (race=lizard) red}
	{FFF_TC_COLORING 1 (race=drake) red}
	{FFF_TC_COLORING 2 (race=undead) white}
	{FFF_TC_COLORING 2 (race=bats) white}
[/scenario]
