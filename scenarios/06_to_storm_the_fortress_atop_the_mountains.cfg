#textdomain wesnoth-fff
# TODO: Custom units for Cheska, Xel, Silan
# TODO: Turns/gold balancing
# TODO: Extra guards?
# TODO: What about player gold (for all three factions)?
[scenario]
    id="06_to_storm_the_fortress_atop_the_mountains"
    next_scenario=07_tracking_the_flying_lizard

    name=_"To Storm The Fortress Atop The Mountains"
	map_file=~add-ons/Fire_Forged_Friends/maps/06_to_storm_the_fortress_atop_the_mountains.map
    victory_when_enemies_defeated=no

    {TURNS 18 15 12}

    {DEFAULT_SCHEDULE}

    {MOOD_DOOM}

    #################
    ### The Story ###
    #################
    [story]
        [part]
            story=_ "todo."
        [/part]
    [/story]


    ###################
    ### Player Side ###
    ###################
	# Cheska is TC green
	# Silan is TC White
	# Xel is TC Red
    [side]
        side=1
        controller=human

        persistent=yes
        save_id=Cheska

        team_name=rats
        user_team_name=_"Cheska's Company"

        colour=green

        no_leader=yes # See [unit] tag below for leader

        recruit=Spearman,Horseman,Bowman

        {GOLD 150 120 90}

        [unit]
            id=Cheska
            type=Captain
            name=_"Cheska"
            unrenamable=yes
            gender=female
            random_traits=no
            canrecruit=yes
            experience=15
            x,y=16,26
            [modifications]
                {TRAIT_STRONG}
                {TRAIT_INTELLIGENT}
            [/modifications]
            [event]
                name=last breath
                [filter]
                    id=Cheska
                [/filter]
                {M id=Cheska (_"For Wesnoth I gladly give my life!")}
            [/event]
        [/unit]
    [/side]

    ####################
    ### Enemy Side 1 ###
    ####################
    [side]
        side=2
        colour=black
        controller=ai
        team_name=orcs
        type=Orcish Warlord
		profile=portraits/orcs/grunt-2.webp
        id=Larry
        name= _ "Larry"
        role=orcS
        canrecruit=yes
        recruit=Orcish Grunt,Wolf Rider,Orcish Archer,Orcish Assassin,Goblin Spearman
        {GOLD 400 600 800}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ####################
    ### Enemy Side 2 ###
    ####################
    [side]
        side=3
        colour=brown
        controller=ai
        team_name=orcs
        type=Orcish Warrior
		profile=portraits/orcs/grunt-3.webp
        id=Moe
        name= _ "Moe"
        role=orcNE
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ####################
    ### Enemy Side 3 ###
    ####################
    [side]
        side=4
        colour=orange
        controller=ai
        team_name=orcs
        type=Orcish Warrior
        id=Curly
        name= _ "Curly"
        role=orcNW
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ##############
    ### Setup: ###
    ##############
    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Move Cheska to the signpost in the north"
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska Kuhral"
            [/objective]
        [/objectives]
        [objectives]
            side=2
            [objective]
                condition=win
                description=_ "Help Cheska get to the signpost in the north"
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Silan Abner"
            [/objective]
        [/objectives]
        [objectives]
            side=3
            [objective]
                condition=win
                description=_ "Help Cheska get to the signpost in the north"
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Xel"
            [/objective]
        [/objectives]
    [/event]

    ###################################
    ### Control and victory events: ###
    ###################################

    [event]
        name=start
        [fire_event]
            name=intro_dialogue
        [/fire_event]
    [/event]

    [event]
        name=moveto
        [filter]
            id=Cheska
            x,y=20,1
        [/filter]
        [endlevel]
          result=victory
        [/endlevel]
    [/event]

    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue
        {M role=orcS (_"Keep running, little man-girl! You make wonderful sport!")}
        {M id=Cheska (_"*Hahh* So tired... I really have to stop and... rest for a moment.")}
        {M speaker=narrator (_"Hm? Those are not orc voices I hear...")}


        {M role=patrol (_"Woah!")}

        {CUE_EPIC}
        {MOOD_EPIC}
    [/event]

 
    [event]
        name=die
        [filter]
            id=Silan
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=Xel
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]


    ##############
    ### Items: ###
    ##############
    [item]
        x,y=20,1
        image="scenery/signpost.png"
    [/item]

[/scenario]
