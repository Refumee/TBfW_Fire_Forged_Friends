#textdomain wesnoth-fff
# TODO: Custom units for Cheska, Xel, Silan
# TODO: Turns/gold balancing
# TODO: Extra guards?
# TODO: What about player gold (for all three factions)?
[scenario]
    id="06_to_storm_the_fortress_atop_the_mountains"
    next_scenario=07_tracking_the_flying_lizard

    name=_"To Storm The Fortress Atop The Mountains"
	map_file=~add-ons/Fire_Forged_Friends/maps/06_to_storm_the_fortress_atop_the_mountains.map
    victory_when_enemies_defeated=no

    {TURNS -1 -1 -1}

    {DEFAULT_SCHEDULE}

    {MOOD_DOOM}

    #################
    ### The Story ###
    #################
    [story]
        [part]
            story=_ "Weeks passed as they fought against the tide of the orcs, and the occasional undead. Despite being separated, Cheska, Silan, and Xel all came to more or less the same conclusions about the matter: the orcs were numerous and everywhere, but lacked any focus and concentration of any organized battleforce, instead raiding and killing very much randomly. This made it relatively easy to push them back as well."
        [/part]
        [part]
            story=_ "It was quite a mystery, however, what had gotten them on the move in the first place. Orcs have always been a warlike race, and launched frequent raids to the surrounding civilizations, but this was something else entirely."
        [/part]
        [part]
            story=_ "Winter had settled in and covered all of Wesnoth in snow, when Silan was at last reunited with the rest of the party. They each had all followed the tracks of the orc activity on their own, finally discovering the location of their warcamp: despite being relatively independent and working separately, there was likely to be a bigger, nastier orc behind it all pulling the strings."
        [/part]
        [part]
            story=_ "Together once more, the three plan on assaulting the orcs and ending this war once and for all..."
        [/part]
		# The topmost base belongs to Silan, while the bottom one is Cheska's. Bottom-right - in the water - is a bunch of nagas, while every other base is occupied by orcs. The camp walls surrounding the mountain have orcs as well: they mostly stay where they are, at least until something comes close enough and it's a pretty smart move for them to go elsewhere. Curiously enough, the one in charge of the whole thing - the leader of the central camp, in the middle of the mountain - is not an orc at all, but an Armageddon Drake . His lackeys are all orcs, however.
    [/story]


    ###################
    ### Player Side ###
    ###################
	# Cheska is TC green
	# Silan is TC White
	# Xel is TC Red
    [side]
        side=1
        controller=human

        persistent=yes
        save_id=Cheska

        team_name=rats
        user_team_name=_"Cheska's Company"

        color=green

        no_leader=yes # See [unit] tag below for leader

        recruit=Spearman,Horseman,Bowman,Cavalryman,Mage,Saurian Skirmisher,Saurian Augur

        {GOLD 150 120 90}

        [unit]
            id=Cheska
            type=Cheska
            name=_"Cheska"
            unrenamable=yes
            gender=female
            random_traits=no
            canrecruit=yes
            experience=15
            x,y=16,26
            [modifications]
                {TRAIT_STRONG}
                {TRAIT_INTELLIGENT}
            [/modifications]
            [event]
                name=last breath
                [filter]
                    id=Cheska
                [/filter]
                {M id=Cheska (_"For Wesnoth I gladly give my life!")}
            [/event]
        [/unit]
    [/side]

    ####################
    ### Enemy Side 1 ###
    ####################
    [side]
        side=2
        color=black
        controller=ai
        team_name=orcs
        type=Orcish Warlord
		profile=portraits/orcs/grunt-2.webp
        id=Larry
        name= _ "Larry"
        role=orcS
        canrecruit=yes
        recruit=Orcish Grunt,Wolf Rider,Orcish Archer,Orcish Assassin,Goblin Spearman
        {GOLD 400 600 800}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ####################
    ### Enemy Side 2 ###
    ####################
    [side]
        side=3
        color=brown
        controller=ai
        team_name=orcs
        type=Orcish Warrior
		profile=portraits/orcs/grunt-3.webp
        id=Moe
        name= _ "Moe"
        role=orcNE
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ####################
    ### Enemy Side 3 ###
    ####################
    [side]
        side=4
        color=orange
        controller=ai
        team_name=orcs
        type=Orcish Warrior
        id=Curly
        name= _ "Curly"
        role=orcNW
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ##############
    ### Setup: ###
    ##############
    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Defeat Galragoth."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska, Silan, or Xel"
            [/objective]
        [/objectives]
    [/event]

    ####################
    ### Start event: ###
    ####################

    [event]
        name=start

		#Cheskas Camp
		{BUILD_CAMP Kea 22 40}
		{BUILD_CAMP Cea 21 40}
		{BUILD_CAMP Cea 21 41}
		{BUILD_CAMP Cea 22 41}
		{BUILD_CAMP Cea 23 41}
		{BUILD_CAMP Cea 23 40}
		{BUILD_CAMP Cea 22 39}
		
		#Silans Camp
		{BUILD_CAMP Kerg 11 9}
		{BUILD_CAMP Cer 10 8}
		{BUILD_CAMP Cer 10 9}
		{BUILD_CAMP Cer 11 10}
		{BUILD_CAMP Cer 12 9}
		{BUILD_CAMP Cer 12 8}
		{BUILD_CAMP Cer 11 8}

        [fire_event]
            name=intro_dialogue
        [/fire_event]
    [/event]

    [event]
		name=turn 10
		#On the tenth turn of conflict, Xel finally shows up. He appears to the mountains, straight east from the drake's base, along with him all the saurian veterans you have, as well as a few human rogues and outlaws. They're all in the player's control. Dialogue is triggered

		{M id=Xel ( _ "Sorry I'm late! Did I miss anything?")}
		{M id=Cheska ( _ "Xel! What kept you?")}
		{M id=Silan ( _ "Great to see you again, little guy!")}
		{M id=Xel ( _ "Hey, Silan is here! Nice to get back in touch with you, too.")}
		{M id=Galragoth ( _ "What is this? Saurians? How did they get past our lines?")}
		{M id=Grunt ( _ "I... don't know, my lord. Sneaky bunch, saurians, as I'm sure you already know. You want us to stop them?")}
		{M id=Galragoth ( _ "(Sarcastically) If you would be so kind...?")}
		{M id=Xel ( _ "Wait, what? How can they have...?")}
		{M id=Silan ( _ "Yes, we have been wondering the same thing. It's a... rather disturbing reveal, I think.")}
		{M id=Cheska ( _ "Whatever the case, we have more pressing matters to worry about right now. Onward, men!")}
    [/event]

    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue
		{M id=Silan ( _ "Cheska! How wonderful to see you again! It has been all too long!")}
		{M id=Cheska ( _ "...Likewise.")}
		{M id=Silan ( _ "You know, I was just watching for this place. I think it was very fortunate we met here: I probably could not have done this all alone.")}
		{M id=Cheska ( _ "Teaming up against a superior number of orcs for our own survival... Just like the old days, I suppose.")}
		{M id=Silan ( _ "Indeed, indeed! ...But where is Xel? I was hoping to meet him as well.")}
		{M id=Cheska ( _ "Xel took his saurians and a few sneaky humans, in an effort to sneak in to the base from the east. He is late, though: I hope anything hasn't happened.")}
		{M id=Silan ( _ "Speaking of their base. Did you notice the...?")}
		{M id=Cheska ( _ "I did.")}
		{M id=Orc grunt ( _ "My lord, we are approached by a... strange combination of forces.")}
		{M id=Lord Flameheart Galragoth ( _ "Indeed? Would you care to elaborate this?")}
		{M id=Grunt ( _ "Well... a necromancer with a bunch of undead from the north. And a human army, allied with a few drakes, from the south. We assume, my lord, that they are all here to bash our heads in.")}
		{M id=Galragoth ( _ "Yes, I believe this assumption might hold some truth in it. Prepare all forces for battle.")}
		{M id=Cheska ( _ "A drake...? How in blazes can a drake be in charge of an orc army?")}
		{M id=Silan ( _ "Beats me. I think it paid them money. A lot of money. Do you suppose it could be behind all this?")}
		{M id=Cheska ( _ "Perhaps, although the motivation is unclear. What I know of drakes - most of it from Xel and his henchmen - is that they are quite happy with what they have, and don't usually run around conquering other people's places.")}
		{M id=Silan ( _ "Further supported by the fact that we indeed don't see many drakes running around in here trying to conquer our place. Suppose you would like to go and ask why he is doing this?")}

        {CUE_EPIC}
        {MOOD_EPIC}
    [/event]

 
    [event]
        name=die
        [filter]
            id=Silan
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=Xel
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

[/scenario]
