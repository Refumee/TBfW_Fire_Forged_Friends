#textdomain wesnoth-fff
# TODO: Custom units for Cheska, Xel, Silan
# TODO: Turns/gold balancing
# TODO: Extra guards?
# TODO: What about player gold (for all three factions)?
[scenario]
    id="05_phantoms_in_the_forest"
    next_scenario=06_to_storm_the_fortress_atop_the_mountains

    name=_"Phantoms in the Forest"
	map_file=~add-ons/Fire_Forged_Friends/maps/05_phantoms_in_the_forest.map
    victory_when_enemies_defeated=no

    {TURNS -1 -1 -1}

    {DEFAULT_SCHEDULE}

    {MOOD_DOOM}

    #################
    ### The Story ###
    #################
    [story]
        [part]
            story=_ "The southeastern areas of Wesnoth were not the only ones with a problem with orcs. Having heard rumours of them assaulting the eastern elven towns, and after being forced to depart from his companions for the time being, Silan had decided to investigate upon the matter. Unfortunately, elves were no less hostile towards necromancy than humans were..."
        [/part]
		# The fog surrounds the area, hiding from your vision such things as elven and orcish combatants locked in a deadly battle. There are far more orcs than elves, though.
    [/story]


    ###################
    ### Player Side ###
    ###################
	# Cheska is TC green
	# Silan is TC White
	# Xel is TC Red
    [side]
        side=1
        controller=human

        persistent=yes
        save_id=Silan

        team_name=rats
        user_team_name=_"Silan's dead folk"
		{INCOME 15 11 90}
        color=white

		share_view=no
		share_vision=no

        no_leader=yes # See [unit] tag below for leader

        {GOLD 150 120 90}

    [/side]

    ####################
    ### Enemy Side 1 ###
    ####################
    [side]
        side=2
        color=black
        controller=ai
        team_name=orcs
        type=Orcish Warlord
		profile=portraits/orcs/grunt-2.webp
        id=Rak
        name= _ "Rak"
        fog=yes
        canrecruit=yes
        recruit=Orcish Grunt,Wolf Rider,Orcish Archer,Orcish Assassin,Goblin Spearman
        {GOLD 150 200 250}
		[ai]
			[goal]
				name=target
				[criteria]
					side=5
				[/criteria]
				value=20
			[/goal]
			[goal]
				name=target
				[criteria]
					side=1
				[/criteria]
				value=0
			[/goal]
		[/ai]
    [/side]

    ####################
    ### Enemy Side 2 ###
    ####################
    [side]
        side=3
        color=brown
        controller=ai
        team_name=orcs
        type=Orcish Warrior
		profile=portraits/orcs/grunt-3.webp
        id=Ruk 
        name= _ "Ruk"
        fog=yes
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
		[ai]
			[goal]
				name=target
				[criteria]
					side=5
				[/criteria]
				value=20
			[/goal]
			[goal]
				name=target
				[criteria]
					side=1
				[/criteria]
				value=0
			[/goal]
		[/ai]
    [/side]

    ####################
    ### Enemy Side 3 ###
    ####################
    [side]
        side=4
        color=orange
        controller=ai
        team_name=orcs
        type=Orcish Warrior
        id=Rok
        name= _ "Rok"
        fog=yes
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
		[ai]
			[goal]
				name=target
				[criteria]
					side=5
				[/criteria]
				value=20
			[/goal]
			[goal]
				name=target
				[criteria]
					side=1
				[/criteria]
				value=0
			[/goal]
		[/ai]
    [/side]
	
    ######################
    ### Neutral Side 1 ###
    ######################
    [side]
        side=5
        color=teal
        controller=ai
        team_name=elves,rats
        type=Elvish Marshal
        id=ElvishLord
        name= _ "Sénd"
        canrecruit=yes
		fog=yes
		share_view=no
		share_vision=no
        recruit=Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Wose
        {GOLD 250 300 375}
		[ai]
			[goal]
				name=target
				[criteria]
					side=2,3,4
				[/criteria]
				value=20
			[/goal]
			[goal]
				name=target
				[criteria]
					side=1
				[/criteria]
				value=0
			[/goal]
		[/ai]
		{NAMED_LOYAL_UNIT 5 (Elvish Hunter) 26 24 (Elvish_Hunter) ( _ "Elvish Hunter")} {GUARDIAN}
    [/side]

    ##############
    ### Setup: ###
    ##############
    [event]
        name=prestart

		[set_variable]
			name=seen
			value=no
		[/set_variable]

        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Defeat all Orcish Leaders."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Silan Abner or the Elvish Leader."
            [/objective]
        [/objectives]
    [/event]

	{STARTING_VILLAGES_ALL 5}

    ####################
    ### Start event: ###
    ####################

    [event]
        name=start

		{CAPTURE_VILLAGES 2 24 10 4}
		{CAPTURE_VILLAGES 3 4 17 5}
		{CAPTURE_VILLAGES 4 6 32 4}

    [/event]

    [event]
		name=turn 3

		#get Silan and his undead back
		[unstore_unit]
			variable=silan_stored
			x,y=1,1
		[/unstore_unit]
		[for]
			array=undead_stored
			[do]
				[unstore_unit]
					variable=undead_stored[$i]
					x,y=recall,recall
				[/unstore_unit]
			[/do]
		[/for]
		[for]
			array=bats_stored
			[do]
				[unstore_unit]
					variable=undead_stored[$i]
					x,y=recall,recall
				[/unstore_unit]
			[/do]
		[/for]

        [fire_event]
            name=intro_dialogue
        [/fire_event]
    [/event]
    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue
		# For obvious reasons, Silan wishes to remain very much hidden during this battle. Therefore, as soon as he arrives on the battlefield, he summons a thick fog to cover his intentions from the elves as well as orcs.

		{MOVE_UNIT id=Silan 3 4}

		{BUILD_CAMP Kerg 3 4}
		{BUILD_CAMP Cer 2 3}
		{BUILD_CAMP Cer 2 4}
		{BUILD_CAMP Cer 3 5}
		{BUILD_CAMP Cer 4 4}
		{BUILD_CAMP Cer 3 3}
		{BUILD_CAMP Cer 2 5}

		{M id=Silan ( _ "Sometimes, justice is as dark as the evil it is fighting, and must remain hidden, lest it would be misunderstood by the forces of good and attacked with the same prejudice than those genuinely evil.")}
		[sound]
			name=magic-dark.ogg
		[/sound]
		[modify_side]
			side=1
			fog=yes
		[/modify_side]
		[redraw]
			clear_shroud=yes
		[/redraw]
		[recall]
			type=Spectre,Nightgaunt,Wraith,Shadow,Ghost,Draug,Revenant,Deathblade,Skeleton
			x,y=4,4
		[/recall]
		[if]
			[have_unit]
				x,y=4,4
			[then]
				[role]
					x,y=4,4
					role=Minion
				[/role]
			[/then]
			[else]
				{UNIT 1 ("Ghost") 4 4 role=Minion}
				[object]
					[filter]
						role=Minion
					[/filter]
					[effect]
						apply_to=image_mod
						add=RC(magenta>white)
					[/effect]
				[/object]
			[/else]
		[/if]
		{M role=Minion ( _ "Lurking in the darkness of fear of death, we have come to exact justice upon the wicked. How shall we do this, master?")}
		{M id=Silan ( _ "Well, obviously we will have to hide from the elves. If everything goes well, we will be able to remove the orcs without them ever realizing we even were here.")}
		{M role=Minion ( _ "And if everything does not go well...?")}
		{M id=Silan ( _ "...")}
		{M id=Silan ( _ "Then we may be forced to defend ourselves from both sides of the conflict. Regardless of how it goes, we must try and keep the elvish casualties at the bare minimum.")}
		[modify_unit]
			[filter]
				id=Silan
			[/filter]
			extra_recruit="Soulless,Blood Bat,Ghoul,Ghost,Skeleton,Skeleton Archer"
		[/modify_unit]
        {CUE_EPIC}
        {MOOD_EPIC}
    [/event]

    [event]
        name=sighted
		#The prime concern of this mission is elves and their attitude. They will start neutral and only attack the orcs, but if the player's forces are ever seen - i.e. any undead is caught at the elf's vision range - they all turn hostile, go looking for the player, and have the following dialogue

		[filter]
			side=1
		[/filter]
		[filter_second]
			side=5
		[/filter_second]
		{M id=$second_unit.id ( _ "An undead! The necromancers are aiding orcs against us?")}
		{M id=Silan ( _ "Um, it's not actually like that. I am here to help y-")}
		{M id=$second_unit.id ( _ "Cerse your slithering tongue, villain! We will come deal with you now!")}
		{M id=Silan ( _ "Augh. Why don't they ever listen?")}

		[set_variable]
			name=seen
			value=yes
		[/set_variable]
		[modify_side]
			side=5
			team_name=elves
			[ai]
				[goal]
					name=target
					[criteria]
						side=1,2,3,4
					[/criteria]
					value=1
				[/goal]
			[/ai]
		[/modify_side]
    [/event]

    [event]
        name=sighted
		#The prime concern of this mission is elves and their attitude. They will start neutral and only attack the orcs, but if the player's forces are ever seen - i.e. any undead is caught at the elf's vision range - they all turn hostile, go looking for the player, and have the following dialogue

		[filter]
			side=1
		[/filter]
		[filter_second]
			side=2,3,4
		[/filter_second]
		[modify_side]
			side=2
			[ai]
				[goal]
					name=target
					[criteria]
						side=1,5
					[/criteria]
					value=1
				[/goal]
			[/ai]
		[/modify_side]
		[modify_side]
			side=3
			[ai]
				[goal]
					name=target
					[criteria]
						side=1,5
					[/criteria]
					value=1
				[/goal]
			[/ai]
		[/modify_side]
		[modify_side]
			side=4
			[ai]
				[goal]
					name=target
					[criteria]
						side=1,5
					[/criteria]
					value=1
				[/goal]
			[/ai]
		[/modify_side]
    [/event]

    [event]
        name=victory
		
		# if the role=Minion is dead
		[if]
			[have_unit]
				role=Minion
			[/have_unit]
			[then]
			[/then]
			[else]
				[role]
					side=1
					race=undead
					role=Minion
				[/role]
			[/else]
		[/if]
		{M role=Minion ( _ "Master, the orcs have been routed. Our task is finished.")}
		{M id=Silan ( _ "You are right, as usual! Let us withdraw!")}

		[role]
			race=elf
			side=5
			role=ElvishSoldier
		[/role]

		[if]
			[variable]
				name=seen
				boolean_equals=no
			[/variable]
			[then]
				{M role=ElvishSoldier ( _ "Look, sir. The mist is withdrawing. The undead are nowhere to be seen, either: we assume they conjured it in the first place, and it vanished along with them.")}
				{M id=ElvishLord ( _ "Cowards, fleeing as soon as we had finished with their orcish allies. They should have come here and met our blades!")}
				{M role=ElvishSoldier ( _ "But sir, there is something else. If you look at the scene, you see many, many dead orcs. Even without the undead, they should have been able to defeat us all with ease - let alone when they had necromancers as their allies.")}
			[/then]
			[else]
				{M id=ElvishLord ( _ "The mist is finally clearing. I cannot help but wonder where it came from.")}
				{M role=ElvishSoldier ( _ "Sir? We have discovered something interesting.")}
				{M id=ElvishLord ( _ "What of?")}
				{M role=ElvishSoldier ( _ "Well, first of all... there are many orcs on the battleground now. There was far more than any of our warriors could ever have slain - perhaps even enough to wipe us all out.")}
			[/else]
		[/if]
		
		{M id=ElvishLord ( _ "Indeed, I can see what you mean. What else?")}
		{M role=ElvishSoldier ( _ "Sir, take a closer look at this body.")}
		{M speaker=narrator ( _ "...")}
		{M id=ElvishLord ( _ "But... this is...")}
		{M role=ElvishSoldier ( _ "Indeed. It was not killed by an elfish weapon...")}
		{M id=ElvishLord ( _ "...But by an orc.")}
		{M role=ElvishSoldier ( _ "But why? Were they infighting? A power struggle, perhaps?")}
		{M id=ElvishLord ( _ "No, I do not think so. I am not saying the orcs don't have such habits, but... take a look.")}
		{M role=ElvishSoldier ( _ "Sir?")}
		{M id=ElvishLord ( _ "The weapons that were used to slay this orc are old. Very, very old, and rusty.")}
		{M role=ElvishSoldier ( _ "But... that might not mean anything. Orcs are not well known for their weapon maintenance, and often pass on swords and other equipment to their young, instead of making new ones.")}
		{M id=ElvishLord ( _ "...Yes. Whatever it was, an infighting or a mysterious ally, it most likely saved our lives. ")}
		{M role=ElvishSoldier ( _ "Intentionally or not.")}
		{M id=ElvishLord ( _ "The entire case is most peculiar.")}

		{CLEAR_VARIABLE seen}
    [/event]

    [event]
        name=die
        [filter]
            id=Silan
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=ElvishLord
        [/filter]
		{M id=Silan ( _ "Oh, no. The elves have been routed.")}
		{M role=Minion ( _ "We have no more purpose here, master, do we?")}
		{M id=Silan ( _ "No. I suppose we could defeat the remaining orcs, but the primary purpose of the act has been lost. We have been defeated here.")}
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

	{FFF_TC_COLORING 1 (race=undead) white}
	{FFF_TC_COLORING 1 (race=bats) white}

[/scenario]
