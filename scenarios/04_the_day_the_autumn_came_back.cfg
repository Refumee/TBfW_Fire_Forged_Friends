#textdomain wesnoth-fff
# TODO: Custom units for Cheska, Xel, Silan
# TODO: Turns/gold balancing
# TODO: Extra guards?
# TODO: What about player gold (for all three factions)?
[scenario]
    id="04_the_day_the_autumn_came_back"
    next_scenario=05_phantoms_in_the_forest

    name=_"The Day The Autumn Came"
	map_file=~add-ons/Fire_Forged_Friends/maps/04_the_day_the_autumn_came_back.map
    victory_when_enemies_defeated=no

    {TURNS -1 -1 -1}

    {DEFAULT_SCHEDULE}

    {MOOD_DOOM}

    #################
    ### The Story ###
    #################
    [story]
        [part]
            story=_ "They did not need to travel for long before they found the headquarters of the necromancers. Indeed, even with their power, they could not have spread their tainted winter too far."
        [/part]
    [/story]


    ###################
    ### Player Side ###
    ###################
	# Cheska is TC green
	# Silan is TC White
	# Xel is TC Red
    [side]
        side=1
        controller=human

        persistent=yes
        save_id=Cheska

        team_name=rats
        user_team_name=_"Cheska's Company"

        color=green

        no_leader=yes # See [unit] tag below for leader

        recruit=Spearman,Horseman,Bowman,Cavalryman,Mage,Saurian Skirmisher,Saurian Augur

        {GOLD 150 120 90}

		fog=yes

        [unit]
            id=Cheska
            type=Captain
            name=_"Cheska"
            canrecruit=yes
            x,y=1,1
        [/unit]
    [/side]

    ####################
    ### Enemy Side 1 ###
    ####################
    [side]
        side=2
        color=black
        controller=ai
        team_name=undead
        type=Lich
        id=Lich
        name= _ "Lich"
        recruit=""
		income=10
        {GOLD 0 50 150}
    [/side]

    ####################
    ### Enemy Side 2 ###
    ####################
    [side]
        side=3
        color=black
        controller=ai
        team_name=undead
        type=Dark Sorcerer
        id=DS #Dark Sorcerer
        recruit=Skeleton,Skeleton Archer,Ghost,Skeletal Corpse,Skeletal Soulless
        {GOLD 400 600 800}
    [/side]

    ##############
    ### Setup: ###
    ##############
    [event]
        name=prestart
		
		#The fog is present once again, preventing you to see the details. But if you could see them, you'd see a bunch of undead wandering about "ghosts, wraiths, and shadows, mainly, very little made of tangible matter.
		
        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Defeat the Undead Leader."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska or Xel."
            [/objective]
        [/objectives]
		
		{UNIT 3 ("Ghost") 21 20 ()}
		{UNIT 3 ("Ghost") 23 23 ()}
		{UNIT 3 ("Skeleton") 21 12 ()}
		{UNIT 3 ("Skeleton") 24 9 ()}
		{UNIT 3 ("Skeleton Archer") 19 8 ()}
		{UNIT 3 ("Skeleton") 12 17 ()}
		{UNIT 3 ("Skeleton Archer") 13 20 ()}

		{UNIT 3 ("Skeletal Corpse") 4 15 ()}
		{UNIT 3 ("Skeletal Corpse") 6 16 ()}
		{UNIT 3 ("Skeletal Corpse") 5 13 ()}
		{UNIT 3 ("Skeleton Soulless") 12 10 ()}
		{UNIT 3 ("Skeletal Corpse") 6 10 ()}
		{UNIT 3 ("Skeleton Soulless") 18 14 ()}
		
		{UNIT 2 ("Revenant") 19 18 ()} {GUARDIAN}
		{UNIT 2 ("Revenant") 9 19 ()} {GUARDIAN}
		{UNIT 2 ("Deathblade") 14 18 ()} {GUARDIAN}
		{UNIT 2 ("Bone Shooter") 9 20 ()} {GUARDIAN}
		{UNIT 2 ("Wraith") 6 19 ()} {GUARDIAN}

        [micro_ai]
            side=3
            ai_type=forest_animals
            action=add
			deer_type=Skeleton,Skeleton Archer,Ghost,Skeletal Corpse,Skeletal Soulless
        [/micro_ai]
		
    [/event]

    ####################
    ### Start event: ###
    ####################

    [event]
        name=start

		{MOVE_UNIT id=Cheska 5 3 }
		
		{BUILD_CAMP Kea 5 3}
		{BUILD_CAMP Cea 4 2}
		{BUILD_CAMP Cea 4 3}
		{BUILD_CAMP Cea 5 4}
		{BUILD_CAMP Cea 6 3}
		{BUILD_CAMP Cea 6 2}
		{BUILD_CAMP Cea 5 2}
		{BUILD_CAMP Cea 6 4}
		{BUILD_CAMP Cea 7 3}
		
		[recall]
			id=Elric
		[/recall]
		[recall]
			id=Xel
		[/recall]
		[recall]
			id=Zeza
		[/recall]
		[recall]
			id=Dorothy
		[/recall]

        [fire_event]
            name=intro_dialogue
        [/fire_event]
    [/event]

    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue
		{M id=Cheska ( _ "This looks like an old dwarven mining camp.")}
		[if]
			[have_unit]
				id=Dorothy
			[/have_unit]
			[then]
				{M id=Dorothy ( _ "You would be correct. I used to come here many times when I was a young girl: the dwarves used to be so friendly, still here at the time, mining their precious metals from the ground. They are long gone now, of course.")}
			[/then]
			[else]
			[/else]
		[/if]
		{M id=Xel ( _ "Something else must have (sniffle) taken over. (Sneeze)")}
		{M id=Cheska ( _ "And we are here to pry it out.")}

        {CUE_EPIC}
        {MOOD_EPIC}
    [/event]
    [event]
        name=sighted

		[filter]
			side=3
		[/filter]
		[filter_second]
			side=1
		[/filter_second]

        [micro_ai]
            side=3
            ai_type=forest_animals
            action=delete
        [/micro_ai]
		
		[set_recruit]
			side=2
			recruit="Revenant,Deathblade,Bone Shooter,Wraith,Shadow"
		[/set_recruit]

    [/event]

    [event]
        name=sighted #Once the Lich finally comes to sight, plot happens

		[filter]
			id=Lich
		[/filter]
		[filter_second]
			side=1
		[/filter_second]

		{M id=Lich ( _ "Ssss! Living ones! What do you want of me?!")}
		{M id=Cheska ( _ "We seek answers, foul Lich! What are you doing here? For what purpose do you freeze the land?")}
		{M id=Lich ( _ "Freeze the land? I do not do such a thing.")}
		{M id=Cheska ( _ "Wait. ...What? You do not?")}
		{M id=Lich ( _ "Indeed I do not. Your hearing is truly impeccable. The decreased temperature is simply a side effect for the project I am running here.")}
		{M id=Xel ( _ "Side effect...? For what?")}
		{M id=Lich ( _ "I do not intend to tell you this. Prepare to meet your end, and beyond!")}

        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Defeat the Lich."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska or Xel."
            [/objective]
        [/objectives]
    [/event]

    [event]
        name=die
        [filter]
            id=Silan
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=Xel
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=last breath
        [filter]
            id=Lich
        [/filter]

		{M id=Lich ( _ "NO! I was... so close...!")}
        [endlevel]
            result=victory
        [/endlevel]
    [/event]

    [event]
        name=victory

		{M id=Cheska ( _ "So close to what, I wonder?")}
		{M id=Xel ( _ "Look! (Sniffle) They have been excavating over here. And... Brrr! It suddenly got so cold!")}
		[if]
			[have_unit]
				id=Dorothy
			[/have_unit]
			[then]
				{M id=Dorothy (or Cheska if Dorothys been killed) ( _ "It would seem as if this hole is the source of the cold. The Lich had been digging something up.")}
			[/then]
			[else]
				{M id=Cheska ( _ "It would seem as if this hole is the source of the cold. The Lich had been digging something up.")}
			[/else]
		[/if]
		{M ("side=1 canrecruit=no") ( _ "Ma'am! It is impossible for us to investigate further due to extreme cold!")} #random soldier in your command
		{M id=Cheska ( _ "The undead can withstand freezing temperatures far better than anything living. I suspect that is what allowed them to do this in the first place.")}
		{M id=Xel ( _ "If only Silan was here right now. He could- (hack) check that place out with those minions of his.")}
		{M id=Cheska ( _ "This is correct. We will ask him to delve further into this once we meet again. But for now, let us seal this hole.")}
		{M id=Xel ( _ "Am I- (sneeze) Is my presence required anymore...?")}
		{M id=Cheska ( _ "No. You can go back to the camp now.")}
		{M id=Xel ( _ "That is what I intended. I will bury myself under the bedsheets and (cough) not come out until spring!")}
		[if]
			[have_unit]
				id=Dorothy
			[/have_unit]
			[then]
				{M id=Dorothy ( _ "I think he is rather cute, in his own special way. Would you agree?")}
				{M id=Cheska ( _ "I... I suppose.")}
				{M id=Xel ( _ "I am not cute! Children are cute. Pets are cute. Like (sniffle)... hamsters, and other adorable fuzzy little things. But I am not!")}
			[/then]
			[else]
			[/else]
		[/if]
    [/event]

[/scenario]
