    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue
        {M role=orcS ( _ "Keep running, little man-girl! You make wonderful sport!")}
        {M id=Cheska ( _ "*Hahh* So tired... I really have to stop and... rest for a moment.")}
        {M id=Elric ( _ "Forgive me Milady, but... there's not much time. We have a new problem.")}
        {M id=Cheska ( _ "What is it now? More orcs? Like we didn't have enough already!")}
        {M id=Elric ( _ "Yes. It is... most unfortunate. You see, Milady... the orcs have circled around ahead of us. We are surrounded.")}
        {M id=Cheska ( _ "Wh-... What?")}
        {M role=orcNW ( _ "Hello, humans. You weren't expecting me?")}
        {M role=orcNE ( _ "They're trapped now! Like rats in a cage!")}
        {M role=orcNW ( _ "Rats? Now I'm hungry.")}
        {M id=Elric ( _ "So... is this how it's going to end, then?")}
        {M id=Cheska ( _ "I suppose. If I was any older, perhaps I would lament my failure in my duty... but right now, all I'm really lamenting is the loss of my own life.")}
        {M id=Elric ( _ "Likewise.")}
        {M speaker=narrator ( _ "Hm? Those are not orc voices I hear...")}
        {M id=Elric ( _ "Huh?")}
        {M id=Cheska ( _ "Who's there?")}

        [unit]
            type="Dark Adept"
            side=2
            id=Silan
            name= _ "Robed Man"
            gender=male
            random_traits=no
            canrecruit=yes
            experience=7
            x,y=9,27
			extra_recruit="Soulless,Blood Bat"
            [modifications]
                {TRAIT_FEARLESS}
                {TRAIT_RESILIENT}
            [/modifications]
            [event]
                name=last breath
                [filter]
                    id=Silan
                [/filter]
                {M id=Silan ( _ "Perhaps... my death was long due...")}
            [/event]
        [/unit]
        {MOVE_UNIT id=Silan 11 27 }

        {M id=Silan ( _ "More humans? Wonderful! I thought I was going to die all alone here!")}
        {M id=Cheska ( _ "Who are you?")}
        {M id=Silan ( _ "Yes, introductions! Where are my manners? My name is Silan. Silan Abner. I have been opposing the invading orcs at every turn, but now it looks like I have ended up biting off a bit more than I could chew. So I suppose we have both ended up in the same hopeless situation. A pleasure to meet you!")}
		
		{MODIFY_UNIT (id=Silan) name ( _ "Silan")}
	
        {M id=Cheska ( _ "Likewise... I suppose. My name is Cheska Kuhral.")}
        {M id=Elric ( _ "My salutations as well, good sir.")}
        {M id=Silan ( _ "So, what do you say then? Alone we may have been doomed, but I believe together we might stand a chance, albeit slim, of escaping and living to fight again another day!")}
        {M id=Cheska ( _ "We appreciate any help you can offer, although... I have to ask, what can a single man offer to us that is any help against that many orcs? Are you perhaps a wizard?")}
        {M id=Silan ( _ "Your assumptions is correct: I often utilize magic on my travels. I believe I can be of just as great help to you as you can be to me.")}
        {M id=Cheska ( _ "I suppose it is settled, then. We will join forces to make a stand against the orcish hor-")}
        [unit]
            type=Saurian Skirmisher
            side=3
            id=Xel
            name= _"Saurian"
            gender=male
            random_traits=no
            canrecruit=yes
            experience=7
            x,y=17,25
            [modifications]
                {TRAIT_SHACKLED}
                {TRAIT_QUICK}
            [/modifications]
            [event]
                name=last breath
                [filter]
                    id=Xel
                [/filter]
                {M id=Xel ( _ "I... feel so... c-cold...")}
            [/event]
        [/unit]
        {M role=patrol ( _ "Woah!")}
        {M id=Elric ( _ "Huh? What's going on over th-")}
        {M id=Xel ( _ "Who goes there? Friend or foe?")}
        {M id=Silan ( _ "Saurians? Can we assume that you are in the same pickle as us?")}
        {M id=Cheska ( _ "Um. Let's suppose we are friends at the moment.")}
        {M id=Silan ( _ "More friends than those orcs over there, anyway.")}
        {M role=orcNE ( _ "Hey, I caught a lizard!")}
        {M role=orcS ( _ "How was it?")}
        {M role=orcNE ( _ "Crunchy on the outside, but chewy on the inside! Yum! I'll go look for more.")}
        {M id=Xel ( _ "Yes, we... met some orcs on our way here. Most of us got through unharmed, but I reckon that way is closed to us now.")}
        {M id=Silan ( _ "That would mean that you are surrounded as well.")}
        {M id=Cheska ( _ "You fell into a different trap, perhaps, but the outcome is the same.")}
        {M id=Xel ( _ "...I see.")}
        {M id=Xel ( _ "Well, my name is Xel.")}

		{MODIFY_UNIT (id=Xel) name ( _ "Xel")}

        {M id=Silan ( _ "Nice to meet you! I'm Silan Abner.")}
        {M id=Cheska ( _ "Cheska Kuhral.")}
        {M id=Xel ( _ "It's a pleasure.")}
        {M role=orcNW ( _ "...see, you can't cook a lizard, since they can take fire really well. What you have to do is take a really big hammer and then SMA-")}
        {M role=orcS ( _ "Oi! Enough talking, let's go get them already!")}
        [unit]
            type="Zeza"
            side=3
            id=Zeza
            name= _"Zeza"
            unrenameable=yes
            gender=male
            random_traits=no
            experience=5
            x,y=18,24
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_RESILIENT}
            [/modifications]
            [event]
                name=last breath
                [filter]
                    id=Zeza
                [/filter]
                [if]
                    [have_unit]
                        id=Silan
                    [/have_unit]
                    [then]
                        {M id=Zeza ( _ "Necromancer! If you ever bring me back... mark my words, I will kill you with my own hands...!")}
                        {M id=Silan ( _ "May you rest in peace, brave drake.")}
                    [/then]
                    [else]
                        [if]
                            [have_unit]
                                id=Xel
                            [/have_unit]
                            [then]
                                {M id=Zeza ( _ "Xel... fight on. Don't let them...")}
                            [/then]
                            [else]
                                {M id=Zeza ( _ "This is a noble death!")}
                            [/else]
                        [/if]
                    [/else]
                [/if]
            [/event]
        [/unit]
        {M id=Zeza ( _ "Xel, they're coming!")}
        {M id=Xel ( _ "Looks like the time for talking is over, then.")}
        {M id=Cheska ( _ "There was entirely too much time for that to begin with. Are you with us then, Xel?")}
        {M id=Xel ( _ "'Stand together or fall apart,' wasn't it? And I want to get out of here alive.")}
        {M id=Cheska ( _ "That's reassuring. Perhaps we do have a chance.")}
        {CUE_EPIC}
        {MOOD_EPIC}
        [scroll_to]
            x,y=20,1
        [/scroll_to]
		{HIGHLIGHT_IMAGE 20 1 scenery/signpost.png ()}
    [/event]

    [event]
        name=moveto
        [filter]
            type=Soulless
            [filter_vision]
                visible=yes
                viewing_side=1
            [/filter_vision]
        [/filter]
        [fire_event]
            name=soulless_spotted
        [/fire_event]
    [/event]

    {FIRE_EVENT_NEXT_SIDE_TURN Silans_necromancy 2 "side turn"}
    {FIRE_EVENT_NEXT_SIDE_TURN Xels_band 3 "side turn"}

    [event]
        name=Silans_necromancy
        {M id=Silan ( _ "Ohh, looks like someone's already been fighting here!")}
        {M id=Cheska ( _ "...I do not like your tone. And frankly, I would rather concentrate upon those still living than the dead.")}
        {M id=Silan ( _ "Quite the contrary, they are just what I needed! Now hold on just a moment...")}
        {M id=Cheska ( _ "Um, what are you...?")}

        [sound]
           name=wail-long.wav 
        [/sound]

        {UNIT 2 Soulless 12 25 ()}

        {UNIT 2 Skeleton 12 26 ()}

        {UNIT 2 Soulless 12 27 ()}
        {UNIT 2 Soulless 11 28 ()}

#ifdef EASY
        {UNIT 2 Skeleton 10 27 ()}
#endif
#ifdef NORMAL
        {UNIT 2 Skeleton 10 27 ()}
#endif
#ifdef HARD
        {UNIT 2 Soulless 10 27 ()}
#endif

        {UNIT 2 Soulless 9 28 ()}

#ifdef EASY
        {UNIT 2 ("Skeleton Archer") 10 26 ()}
#endif
#ifdef NORMAL
        {UNIT 2 ("Skeleton Archer") 10 26 ()}
#endif
#ifdef HARD
        {UNIT 2 Soulless 10 26 ()}
#endif

        {UNIT 2 Soulless 9 26 ()}
        {UNIT 2 Soulless 11 26 ()}

        {M id=Silan ( _ "Hmph, just like orcs to send weaklings ahead of their main forces. They don't make good fighters alive *or* dead.")}
        {M id=Cheska ( _ "Wait. Are those...?")}
        {M id=Xel ( _ "They are corpses that walk. You are a necromancer.")}
        {M id=Silan ( _ "...Why yes. What of it?")}
        {M id=Cheska ( _ "What of it...? What of it?! You practise the vilest of all magics! You conspire with evil spirits, desecrate the dead and force them back to the world of the living, enslaving their souls for your own purpose!")}
        {M id=Silan ( _ "...Which has so far been opposing the orcish hordes that murder and pillage our countryside, and which is, as of now, to get you and your friends out of here alive. Besides, I use no humans, only orcs: they deserve it.")}
        {M id=Cheska ( _ "I think even orcs deserve the peace of death.")}
        {M id=Silan ( _ "And that they shall get, eventually. However, I think it a fair trade that they must first absolve some of their sins by helping the humans they have opposed so violently. Don't you think that's fair?")}
        {M id=Xel ( _ "No. All sins are absolved by death. And, like Cheska here said, everyone should be allowed to rest in peace, be he a man, an orc, or a drake.")}
        {M id=Zeza ( _ "When a drake grows old and nears his end, he seeks the most glorious death possible. And if he were to be brought back to life after finding one, that would make mockery of all he accomplished!")}
        {M id=Silan ( _ "Your point is acknowledged, my friends, but you will have to admit that you can't possibly get out of here alive without my help.")}
        {M id=Xel ( _ "...Yes. But that doesn't mean we have to like it.")}
        {M id=Cheska ( _ "I will let you be... for now.")}
        {M role=orcNE ( _ "Look! The advance guard is moving again! I thought they all died!")}
        {M role=orcS ( _ "They did die, you moron! That's necromancy the bloke is using. And boy, those poor orcs' mommas will not be too happy about this!")}
    [/event]

    [event]
        name=Xels_band
        {M id=Xel ( _ "Alright, let's fight our way out of here!")}
        {UNIT 3 ("Saurian Skirmisher") 19 22 experience=4 }
        {UNIT 3 ("Saurian Skirmisher") 20 23 experience=7 }
        {UNIT 3 ("Saurian Skirmisher") 20 24 experience=3 }
        {UNIT 3 ("Saurian Skirmisher") 21 23 experience=2 }
        {UNIT 3 ("Saurian Skirmisher") 23 24 experience=4 }
#ifdef EASY
        {UNIT 3 ("Saurian Skirmisher") 21 22 experience=6 }
#endif

        {UNIT 3 ("Saurian Augur") 19 24 experience=5 }
        {UNIT 3 ("Saurian Augur") 21 24 experience=3 }

#ifdef EASY
        {UNIT 3 ("Saurian Augur") 22 23 experience=6 }
#endif
#ifdef NORMAL
        {UNIT 3 ("Saurian Augur") 22 23 experience=6 }
#endif
        {M id=Cheska ( _ "Wh- Where did those guys come from?")}
        {M id=Xel ( _ "Apparently there's a thing or two I could teach you about stealth.")}
		{MOVE_UNIT id=Xel 21 27 }
    [/event]

    [event]
        name="turn 2"
        {M id=Cheska ( _ "So, Xel... What's your story?")}
        {M id=Xel ( _ "I... do not wish to talk about it.")}
        {M id=Cheska ( _ "I understand. But do you at least want some help with those shackles?")}
        {M id=Xel ( _ "I doubt there's anything you can do. You have no idea what we had to go through just to cut the chains away and to free me.")}
        {M id=Silan ( _ "You were clearly held prisoner. Captive.")}
        {M id=Xel ( _ "No! I mean... don't make assumptions.")}
    [/event]

    # Bats come out at dusk...
