        [/scroll_to]
        {UNIT 2 ("Vampire Bat") 24 21 ()}
        {UNIT 2 ("Vampire Bat") 25 20 ()}
        {UNIT 2 ("Vampire Bat") 25 23 ()}
#ifdef EASY
        [scroll_to]
            x,y=6,9
        [/scroll_to]
        {UNIT 2 ("Vampire Bat") 6 9 ()}

        [scroll_to]
            x,y=23,4
        [/scroll_to]
        {UNIT 2 ("Vampire Bat") 23 4 ()}
#endif
		{M id=Cheska ( _ "Please, Silan. Do not tell me those things are with you.")}
		{M id=Silan ( _ "Do you have some kind of a problem with bats?")}
    [/event]

    [event]
        name=die
        [filter]
            type=Soulless
        [/filter]
        {M id=Silan ( _ "See? That could have been one of your people.")}
        {M id=Cheska ( _ "...")}
        {M id=Silan ( _ "Every death of what is already dead means one less living casualty. I can always revive more dead, but the living are rare and limited, especially in this situation. Nothing of true value will ever be lost.")}
        {M id=Cheska ( _ "Hmph. I concede that point. But do not for once think that we will not have a thorough discussion about this, once the danger is over.")}
        {M id=Silan ( _ "I would never dream of it.")}
    [/event]

    [event]
        name=die
        [filter_second]
            id=Cheska
        [/filter_second]
        {M id=Cheska ( _ "Die! If you thought I would give up so easily, then you are sorely mistaken!")}
        {M id=Silan ( _ "Hah! I remember how before I arrived to help, you were indeed about to give up!")}
        {M id=Cheska ( _ "Silence, necromancer. I will not hear such talk from someone like you.")}
    [/event]

    [event]
        name=die
        [filter_second]
            id=Silan
        [/filter_second]
        {M id=Silan ( _ "They never learn... I am not a man to be trifled with.")}
    [/event]

    [event]
        name=die
        [filter_second]
            id=Xel
        [/filter_second]
        {M id=Xel ( _ "You can't keep me here!")}
    [/event]

    [event]
        name=victory
        {M id=Xel ( _ "We got through! We have broken past the blockade!")}
        {M id=Silan ( _ "Well, that was not quite as difficult as I had thought! Now we should-")}
        {M id=Cheska ( _ "Men! Seize the necromancer!")}
        [role]
            role=guard1
            side=1
            [not]
                id=Cheska
            [/not]
        [/role]
        [role]
            role=guard2
            side=1
            [not]
                id=Cheska
            [/not]
            [not]
                role=guard1
            [/not]
        [/role]
        [store_unit]
            kill=no
            variable=silan
            [filter]
                id=Silan
            [/filter]
        [/store_unit]
        {MOVE_UNIT role=guard1 $silan.x $silan.y }
        {MOVE_UNIT role=guard2 $silan.x $silan.y }
        [clear_variable]
            name=silan
        [/clear_variable]
        # TODO: Sound effect here!
        {M id=Silan ( _ "What is this?")}
        {M id=Cheska ( _ "You are charged with the crime of necromancy: before our very eyes you have animated the dead and performed many dark and twisted spells. You are also suspected of conspiracy against the throne of Wesnoth.")}
        {M id=Silan ( _ "What? That is simply unfair. Just because I wield darker magic than most, indicates absolutely nothing about whether I wish to throw the good king Konrad from the throne!")}
        {M id=Cheska ( _ "Your help here is greatly appreciated, however, and I will speak on your behalf in court.")}
        {M id=Silan ( _ "Well, that is generous.")}
        {M id=Cheska ( _ "Even so, I fully expect you to be executed for this. I hope there will be no hard feelings.")}
        {M id=Silan ( _ "...Hmph. There will be none, I suppose. You can do nothing else.")}
        {M id=Cheska ( _ "What about you, then, Xel? What do you wish to do now?")}
        {M id=Xel ( _ "...Well, first of all, I would really appreciate if you stopped looking at me like that.")}
        {M id=Cheska ( _ "I saw how you fight. And I have heard enough stories and rumours of your kind to be careful.")}
        {M id=Xel ( _ "So what about how I fight? I have no reason to stab you in the back.")}
        {M id=Cheska ( _ "I know none of your reasons. That's what worries me most.")}
        {M id=Xel ( _ "Well, if you absolutely have to know... all I want is to not return home, and perhaps to get these shackles away. Do you have a problem with that?")}
        {M id=Cheska ( _ "No.")}
        {M id=Xel ( _ "Good, then I will not betray you.")}
        {M id=Xel ( _ "...")}
        [delay]
            time=500
        [/delay]
        {M id=Xel ( _ "Would you have a problem with me sticking with you, though? I mean, we helped each other out once: maybe we can do so again.")}
        {M id=Cheska ( _ "...Perhaps. You do have a point.")}
        {M id=Cheska ( _ "But if you try anything funny, I will kick you out. Possibly in several pieces.")}
        {M id=Xel ( _ "Yeah, sounds fair enough. (Geez, talk about a problem with trusting people!)")}
        {M id=Cheska ( _ "I heard that!")}
