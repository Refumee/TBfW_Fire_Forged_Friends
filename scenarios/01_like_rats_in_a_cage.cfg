    #################
    ### The Story ###
    #################
    [story]
        [part]
            story= _ "At the age of eighteen, the newly knighted Cheska Kuhral, a noblewoman by birth and education, received her first position of command on the southeastern fringe of the kingdom of Wesnoth. It was a relatively peaceful age, and an even more peaceful corner of the land: neither Cheska nor her superiors expected the responsibility that had been given to her to bring with it much of a challenge."
        [/part]
        [part]
            story= _ "Unfortunately, they could not have been more wrong. Barely a month had passed with the young Cheska in command when the keeps and outposts were assaulted by the largest orcish raiding band in recent memory. To her credit it must be said that she put up a great fight, refusing to surrender for many days, but in the end, the orcs proved to be too much for her: the human outposts were overrun, most defending forces slaughtered, and the commander herself forced to retreat, along with what little was left of her forces."
        [/part]
        [part]
            story= _ "Meanwhile, a lone wanderer approached her through the western mountain range. Wherever he went, small orcish scout teams would vanish without a trace, failing to return to their camps and report their findings - and said camps would shortly face assaults of their own dead, walking corpses and incorporeal spirits cutting down the living, spreading panic and chaos among the ranks of those that survived. The wanderer went where the raid did, opposing it from the shadows at every opportunity - and where the raid went was where Cheska happened to be. The convergence of the two forces and the loner was inevitable."
        [/part]
        [part]
            story= _ "And from the east, from far away, an even more insignificant force was closing in. Small and stealthy, capable of sneaking past orcs and humans alike, the tiny band of lizards finally entered human territory. Shackled, scarred, starving, and afraid: turning back every now and then to see if they were chased, not stopping even when the running hurt. They cared not where they were going, only what they were running from, and how to get even farther away from it. They did not know that they were entering upon the scene of a great battle. They did not know not that they were approaching either an unlikely alliance... or death."
        [/part]
    [/story]


