#textdomain wesnoth-fff
# TODO: Custom units for Cheska, Xel, Silan
# TODO: Turns/gold balancing
# TODO: Extra guards?
# TODO: What about player gold (for all three factions)?
[scenario]
    id="07_tracking_the_flying_lizard"
    next_scenario=08_strikeback

    name=_"Tracking The Flying Lizard"
	map_file=~add-ons/Fire_Forged_Friends/maps/07_tracking_the_flying_lizard.map
    victory_when_enemies_defeated=no

    {TURNS -1 -1 -1}

    {DEFAULT_SCHEDULE}

    {MOOD_DOOM}

    #################
    ### The Story ###
    #################
    [story]
        [part]
            story=_ "It was an unanimous decision of them that this drake would have to be hunted down and captured, if any progress was ever made in this campaign. Silan's bats and ghosts could fly and keep up with the giant lizard fairly well, bringing back reports of where it was heading - but the proper ground force had to take the much slower path, following the trail by foot."
        [/part]
        [part]
            story=_ "The track led south, but while drake's road may have been straight and uneventful, it was not to be for those who followed him from below. Snow and storms slowed them down, mountains and paths blocked by snow seemed to force them change route at every turn. Further, they were occasionally assaulted by more orcs, doubtlessly by the drake's orders: some of them, Xel and the lizards especially, would even have preferred more of these attacks if in exchange they would have gained better weather and warmer climate. But much to everyone's annoyance, they had to endure both."
        [/part]
        [part]
            story=_ "Eventually, though the trail kept going on forward without changing course, the unlikely alliance following it was forced to stop, as they discovered that the path, the very same Cheska and Xel had used only a week before, had been shut with snow and rock, brought down by fierce winter storms. Continuing on this road would be impossible until spring. They had to take a different path, and it led them southwest, through mountains and forest and across the River Listra."
        [/part]
        [part]
            story=_ "Their quest had brought them a long way from their starting point, right into the heart of the Northlands, full of roaming barbarians and wild orcs - with an occasional dwarf, whose help Cheska now sought to seek. It would help them a lot, she argued, and would only take a slight detour, but there were still some members of the party who were very much against it."
        [/part]
		#The fort right at the middle of the river belongs to nagas, while the one east from it is orcs. The southern base has an orcish slurbow who can recruit both ground units and nagas. There's also an occasional yeti running around. But you can't see any of it because of the fog: winter is a cruel mistress
    [/story]


    ###################
    ### Player Side ###
    ###################
	# Cheska is Green
	# Silan is White
	# Xel is Red
	# Orcs are Brown
	# Drakes are Black
	# Naga are Teal
	# Undead are Purple
	# Elves are Orange
	# Humans are Lightblue
    [side]
        side=1
        controller=human

        persistent=yes
        save_id=Cheska

        team_name=rats
        user_team_name=_"Cheska's Company"

        color=green
		fog=yes

        no_leader=yes # See [unit] tag below for leader

        recruit=Spearman,Horseman,Bowman,Cavalryman,Mage,Saurian Skirmisher,Saurian Augur

        {GOLD 150 120 90}

    [/side]

    ####################
    ### Enemy Side 1 ###
    ####################
    [side]
        side=2
        color=brown
        controller=ai
        team_name=orcs
        type=Orcish Warrior
        id=Orc1
        canrecruit=yes
        recruit=Orcish Grunt,Wolf Rider,Orcish Archer,Orcish Assassin,Goblin Spearman
        {GOLD 150 200 250}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ####################
    ### Enemy Side 2 ###
    ####################
    [side]
        side=3
        color=teal
        controller=ai
        team_name=orcs
        type=Naga Sicarius
        id=Naga
        canrecruit=yes
        recruit=Naga Dirkfang,Naga Fighter,Naga Guard
        {GOLD 150 200 250}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ####################
    ### Enemy Side 3 ###
    ####################
    [side]
        side=4
        color=brown
        controller=ai
        team_name=orcs
        type=Orcish Slurbow
        id=Orc2
        canrecruit=yes
        recruit=Orcish Grunt,Wolf Rider,Orcish Archer,Orcish Assassin,Goblin Spearman,Naga Dirkfang,Naga Fighter,Naga Guard
        {GOLD 150 200 250}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]
    ####################
    ### Enemy Side 4 ###
    ####################
    [side]
        side=5
        color=orange
        controller=ai
        team_name=elves
		hidden=yes

		no_leader=yes

    [/side]

    ######################
    ### Neutral Side 1 ###
    ######################
    [side]
	#todo: yetis, who will remain neutral unless attacked first
        side=6
        color=gold
        controller=ai
        team_name=monster
		hidden=yes
		{UNIT 6 ("Yeti") 10 10 ()}
		{UNIT 6 ("Yeti") 5 35 ()}

		[unit]
			type="Yeti"
			side=6
			x=30
			y=27
			id=Friendlyyeti
			generate_name=yes
			ai_special=guardian
			[modifications]
				{TRAIT_LOYAL}
			[/modifications]
		[/unit]

        [micro_ai]
            side=6
            ai_type=big_animals
            action=add
            [filter]
                type=Yeti
            [/filter]
            [filter_location]
                terrain=Ai,Ms,Aa,Ha,Ww,*^Fpa
            [/filter_location]
        [/micro_ai]

    [/side]

    ######################
    ### Neutral Side 2 ###
    ######################
    [side]
        side=7
        color=lightblue
        controller=ai
        team_name=elves
		hidden=yes

		no_leader=yes
    [/side]

    ##############
    ### Setup: ###
    ##############
    [event]
        name=prestart
		{CAPTURE_VILLAGES 2 23 15 6}
		{CAPTURE_VILLAGES 3 15 20 5}
		{CAPTURE_VILLAGES 4 23 37 8}
		[recall]
			id=Cheska
			x,y=17,1
		[/recall]
        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Move Cheska and Silan to the southern keep."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska, Silan, or Xel"
            [/objective]
        [/objectives]
    [/event]

    ####################
    ### Start event: ###
    ####################

    [event]
        name=start
		{MOVE_UNIT id=Cheska 24 1}
		[redraw]
			clear_shroud=yes
		[/redraw]
		#Cheskas Camp
		{BUILD_CAMP Kea 24 1}
		{BUILD_CAMP Cea 23 1}
		{BUILD_CAMP Cea 24 2}
		{BUILD_CAMP Cea 25 2}
		{BUILD_CAMP Cea 25 1}
		{BUILD_CAMP Cea 25 3}

		[recall]
			id=Elric
		[/recall]
		[recall]
			id=Silan
		[/recall]
		[recall]
			id=Xel
		[/recall]
		[recall]
			id=Zeza
		[/recall]
		[recall]
			id=Dorothy
		[/recall]
		[redraw]
			clear_shroud=yes
		[/redraw]

        [fire_event]
            name=intro_dialogue
        [/fire_event]
    [/event]

    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue
		{M id=Cheska ( _ "Are you cold?")}
		{M id=Xel ( _ "...I have decided that I hate this winter of yours. It's freezing, it's wet, it makes me ill, it feels awful, and it makes me think everybody thinks I'm weak whenever you try to help me out.")}
		{M id=Cheska ( _ "I don't think y-")}
		{M id=Xel ( _ "I know! But it makes me think you do. Even if you just try to show you care... which I really appreciate, by the way.")}
		{M id=Silan ( _ "I'm still against this.")}
		{M id=Cheska ( _ "Yes, we heard you the first time. I'm just saying, refrain from dark magic and nobody will be any wiser.")}
		{M id=Silan ( _ "Have you ever actually met any dwarves?")}
		{M id=Cheska ( _ "As a little girl, yes, but...")}
		{M id=Silan ( _ "I have been in a dwarf city twice, at both times barely escaping with my life, despite not using necromancy.")}
		{M id=Silan ( _ "They can smell the taint in me: I will only put the rest of you in danger as well.")}
		{M id=Xel ( _ "I... I'm going to agree with Cheska.")}
		{M id=Cheska ( _ "That's very nice of you, Xel.")}
		{M id=Xel ( _ "Um, yeah, thanks.")}
		{M id=Cheska ( _ "I cannot help but wonder your motivations for that, though.")}
		{M id=Xel ( _ "Well it is a smart move, isn't it? Besides, we already went through an elf land, and you didn't hear me complaining about it. ")}
		{M id=Xel ( _ "I think you're just overestimating the danger.")}
		{M id=Silan ( _ "And I think someone's a bit overeager to please Cheska.")}
		{M id=Xel ( _ "And what is that supposed to mean?")}
		{M id=Silan ( _ "Oh, nothing.")}
		{M id=Cheska ( _ "Look, we can talk about this later, once we have crossed Listra. Wherever we want to go now, it will be impossible without crossing at least once, right?")}
		{M id=Elric ( _ "Crossing rivers is extremely dangerous on winter. And if we go to the dwarves first, we will only have to do so once.")}
		{M id=Silan ( _ "...")}
		{M id=Cheska ( _ "Don't worry, Silan. We will take care of you: I promise nothing will happen to you as long as I'm there.")}
		{M id=Silan ( _ "...Fine. We will go to that outpost of yours.")}
		{M id=Xel ( _ "As soon as we have crossed the river.")}
		{M id=Silan ( _ "As soon as we have crossed the river.")}

        {CUE_EPIC}
        {MOOD_EPIC}
    [/event]
	
	[event]
		name=enter_hex
		[filter]
            id=Xel
			x=22,23,24,25,26
			y=1-2,3,3,4,1-3
        [/filter]
		# As soon as Xel tries to move outside the starting fortress (i.e. any tile that contains snow), this happens
		{M id=Xel ( _ "(A tumbling sound effect) Oof!")}
		{M id=Silan ( _ "You sure are slow in the snow.")}
		{M id=Xel ( _ "Why. Couldn't. You. People. Have. Winters. With. LESS. SNOW?!")}
		{M id=Cheska ( _ "...As if this wasn't going to take forever to begin with.")}
		[store_unit]
			[filter]
				id=Xel
			[/filter]
			variable=xel_stored
			kill=no
		[/store_unit]
		{MOVE_UNIT id=Cheska $xel_stored.x $xel_stored.y }
		{M id=Xel ( _ "...Wait, what are you going to... Hey!")}
		[kill]
			id=Xel
		[/kill]
		#Xel now vanishes from the map entirely for the rest of the mission. Why? Because Cheska just picked him up!
		{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "Put me down this instant!")}
		{M id=Cheska ( _ "You are slowing us all down: I am not patient enough to wait for you, nor am I cruel enough to leave you here to rot. This is the only option and I refuse to put you down.")}
		{M speaker=narrator ( _ "She lifts him on her back.")}
		{M id=Cheska ( _ "Now stay up there and try not to disturb me too much.")}
		{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "...This is so humiliating.")}

        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Move Cheska and Silan to the southern keep."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska with Xel or Silan"
            [/objective]
        [/objectives]

		#And so Xel becomes unplayable for the rest of the scenario, on grounds of being carried around by Cheska. Some new sprites and a portrait for this would be amusing, but largely unnecessary. It might also be possible to give her some gameplay changes, such as extra attacks, thanks to Xel hanging around her back and doing his part in fending off the enemies - but I suspect this to be too much for Solsword's coding skills.")}
		[event]
			name=exit_hex
			# There's some more dialogue when Cheska next tries to move

			[filter]
				id=Cheska
			[/filter]
			
			{M id=Cheska ( _ "Eugh!")}
			{M id=Silan ( _ "What's wrong?")}
			{M id=Cheska ( _ "There's something awfully cold pressing against my neck!")}
			{M_OFFMAP $xel_stored.profile $xel_stored.name( _ "Sorry...! That... that was me. I didn't mean to startle you or anything, I just tried to find a nice comfortable position.")}
			{M id=Cheska ( _ "By pressing your nose against my neck?")}
			{M_OFFMAP $xel_stored.profile $xel_stored.name( _ "Your neck is comfortable!")}
			{M id=Silan ( _ "...")}
			{M id=Cheska ( _ "What's so funny?")}
			{M id=Silan ( _ "Oh, nothing.")}
		[/event]
	[/event]

    [event]
        name=sighted
		# When the first yeti shows up
		[filter]
			side=6
		[/filter]
		[filter_second]
			side=1
		[/filter_second]

		{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "...")}
		{M id=Silan ( _ "(Sigh) Close your mouth please, Xel, we are not a codfish.")}
		{M id=Cheska ( _ "What is that thing?")}
		{M id=Silan ( _ "That would be a yeti. They live high up in the mountains - and occasionally come down here in winter.")}
		{M id=Silan ( _ "And of course you wouldn't know about them since you are a close-minded noble girl, raised to not believe in such fictional nonsense.")}
		{M id=Cheska ( _ "Don't make your own assumptions: I simply haven't heard of those things before.")}
		{M id=Silan ( _ "I take it nobody ever read bedtime stories for you.")}
		{M id=Cheska ( _ "...No.")}
		{M id=Silan ( _ "That would explain it.")}
    [/event]

    [event]
        name=pre attack
		# Assuming the player hasn't foolishly tried to attack a yeti by now, a dialogue occurs once an enemy tries to attack one
		[filter]
			side=1,2,3,4,5
		[/filter]
		[filter_second]
			side=6
		[/filter_second]
		
		{M id=$unit.id ( _ "Augh, a monster! Die!")}
		{M id=Cheska ( _ "He's only going to make it angry!")}
		{M id=Silan ( _ "...I think we should run. Like, really really fast.")}
    [/event]

    [event]
        name=enter_hex
		# Once river finally comes to sight
		[filter]
			side=1
			[filter_location]
				terrain=Wo,Ai,Ww
				radius=6
			[/filter_location]
		[/filter]
		
		{M id=$unit.id( _ "Look! I can see Listra!")}
		{M id=Dorothy ( _ "Yes, but... it has not frozen properly. It will not be easy to cross it.")}
		{M id=Silan ( _ "Maybe we could use Cheska's sword?")}
		{M id=Cheska ( _ "What?")}
		{M id=Silan ( _ "Haven't you read of Sir Osla?")}
		{M id=Cheska ( _ "Of course I have, but how does he have to do with...")}
		{M id=Cheska ( _ "...Oh. Heh heh, I get it now. If only your highly amusing jokes could help us get past this river.")}
		{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "Who's this Osla guy?")}
		{M id=Silan ( _ "Oh, he was some knight of the old days - well before Wesnoth, even. They say he used to have a sword that was long and wide enough to use as a bridge.")}
		{M id=Cheska ( _ "Which would make it much bigger than mine.")}
		{M id=Silan ( _ "Which is why we will have to hope that the ice will hold.")}

		[event]
			name=enter_hex
			# And once Cheska steps on some shallow water, this additional dialogue plays out
			[filter]
				id=Cheska
				[filter_location]
					terrain=Wo,Ai,Ww
				[/filter_location]
			[/filter]
			
			{M id=Silan ( _ "Say, do you know how Osla eventually met his demise?")}
			{M id=Cheska ( _ "Um... I think I may have missed that one. How?")}
			{M id=Silan ( _ "His sword fell out of his sheath when he was crossing a river, just like we are now. Then the now empty sheath was filled with water, and its weight pulled him underwater and drowned him.")}
			{M id=Cheska ( _ "Okay, that was not as funny as your first jok- Xel, would you mind not scurrying on atop of my head?!")}
			{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "You just take care of your sword!")}
			{M id=Cheska ( _ "It will be fine, you buffoon!")}
			{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "I will take no chances.")}
		[/event]

    [/event]
	
	[event]
		name=enter_hex
		# Once the player steps on the middle part of the western patch of wood, left from the second enemy camp, they're suddenly assaulted by elven rangers!
		[filter]
			side=1
			x,y=6,25
			radius=3
		[/filter]

		[move_unit_fake]
			x=2,3
			y=28,24
			type="Elvish Ranger"
			side=5
		[/move_unit_fake]
		[move_unit_fake]
			x=4,7
			y=28,22
			type="Elvish Ranger"
			side=5
		[/move_unit_fake]
		[move_unit_fake]
			x=4,7
			y=27,25
			type="Elvish Ranger"
			side=5
		[/move_unit_fake]

		{UNIT 5 ("Elvish Ranger") 2 28 ()}
		{UNIT 5 ("Elvish Ranger") 4 28 ()}
		{UNIT 5 ("Elvish Ranger") 4 27 ()}
#ifdef NORMAL
        {UNIT 5 ("Elvish Ranger") 5 27 ()}
#endif
#ifdef HARD
		{UNIT 5 ("Elvish Ranger") 5 27 ()}
		{UNIT 5 ("Elvish Ranger") 3 30 ()}
#endif
		{M id=Cheska ( _ "What the-?")}
	[/event]

	[event]
		name=last breath
		first_time_only=no
		id=elves_first_attack
		[filter]
			side=5
		[/filter]
		[if]
			[have_unit]
				side=5
				count=0
			[/have_unit]
			[then]
			#Extremely unpolitely and very much against the norms of this game, the elves don't explain their actions in any way instead they simply attack. There are three to five rangers in this forest, depending on the difficulty level, and once they're dead, there will be a word or two of talking between the heroes

			{M id=Cheska ( _ "What was that all about?")}
			{M id=Silan ( _ "These elves are evidently from Lintanir forest. It seems we have been followed.")}
			{M id=Xel ( _ "But, why would they attack us?")}
			{M id=Silan ( _ "It should be obvious, now shouldn't it?")}
			{M id=Silan ( _ "And it's not just me, either: if I remember correctly, they have an extremely conflicted history with saurians as well. And Cheska, of course, is an undead sympathiser, and thus must also die.")}
			{M id=Cheska ( _ "But we helped them against orcs, you especially so!")}
			{M id=Silan ( _ "Indeed we did. Maybe it's the reason we only face crazy fanatics instead of their entire army.")}
			[remove_event]
				id=elves_first_attack
			[/remove_event]
			[/then]
		[/if]

	[/event]

	[event]
		name=enter_hex
		# There is another ambush on the very middle island, the one that also contains one very conspicuous elven village.
		# There's some more dialogue the second time the party is about to cross the river
		[filter]
			side=1
			x,y=12,29
			radius=3
		[/filter]
		
		{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "Hey, wait, hold on a second. Woah!")}
		{M id=Cheska ( _ "What? What?")}
		{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "Didn't we cross the river already? Why are we turning back here?")}
		{M id=Silan ( _ "Because in the south we are blocked first by mountains and then by a small, conspicuously deep and impassable branch of river. The way is shut, and we must cross once more.")}
		{M id=Cheska ( _ "At least you're not the one who has to actually wade waist-deep in cold water. So stop complaining.")}

		[move_unit_fake]
			x=12,12
			y=29,31
			type="Elvish Ranger"
			side=5
		[/move_unit_fake]
		[move_unit_fake]
			x=12,14
			y=29,30
			type="Elvish Ranger"
			side=5
		[/move_unit_fake]
		{UNIT 5 ("Elvish Ranger") 12 31 ()}
		{UNIT 5 ("Elvish Ranger") 14 30 ()}

		{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "Shh! Did you hear that?")}
	[/event]

	[event]
		name=enter_hex
		# The middle of the glacier you enter right after that will contain a bunch of cuttle fish and water serpents
		[filter]
			side=1
			x=20-22
			y=26
			radius=3
		[/filter]
		{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "So-something moved underwater!")}
		{M id=Cheska ( _ "Yes, I saw it.")}
		# After that, a fishy ambush ensues, and a battle is inevitable
	[/event]

	[event]
        name=sighted
		[filter]
			id=Friendlyyeti
		[/filter]
		[filter_second]
			side=1
		[/filter_second]

		# And a little while after that, just a few steps northeast from that mountain range, there is a yeti standing on a thin ice (how it's not falling straight through to the cold waters is a mystery), fighting some more water serpents. If you kill the yeti, the serpents will attack you next ( _ "however, if you succesfully save the yeti by killing the serpents, it will become tame and make a permanent addition to your group of merry men (and a couple women)")}
		{UNIT 3 ("Cuttle Fish") 29 29 ()}
		{UNIT 3 ("Water Serpent") 29 27 ()}
		{UNIT 3 ("Water Serpent") 30 31 ()}

        [micro_ai]
            side=3
            ai_type=assassin
            action=add
            [filter]
                type=Cuttle Fish,Water Serpent
            [/filter]
			[filter_second]
                id=Friendlyyeti
            [/filter_second]
        [/micro_ai]
	[/event]

	[event]
		name=last breath
		first_time_only=no
		id=rescueyeti
		[filter]
			side=3
		[/filter]
		[if]
			[have_unit]
				side=3
				count=0
				type=Cuttle Fish,Water Serpent
			[/have_unit]
			[then]
				{M id=Cheska ( _ "It's... not attacking us.")}
				{M id=Elric ( _ "Looks like it might be thankful to us. We sort of saved his life.")}
				{M id=Cheska ( _ "Really? Do you think it could come with us?")}
				{M id=Silan ( _ "I say we eat it.")}
				{M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "What are you talking about? Look at those gigantic paws! This thing could make a pretty good soldier!")}
				{M id=Silan ( _ "Those giant paws are exactly what worries me!")}
				{M id=Cheska ( _ "...")}
				{M id=Friendlyyeti ( _ "Urr?")}
				{M id=Cheska ( _ "...Nah, sorry about this Silas, but I'm with Xel. It could be of use to us.")}
				{M id=Friendlyyeti ( _ "Gwarr!")}

				[modify_unit]
					[filter]
						id=Friendlyyeti
					[/filter]
					side=1
				[/modify_unit]

				[remove_event]
					id=rescueyeti
				[/remove_event]
			[/then]
		[/if]
	[/event]

	[event]
		name=enter_hex
		# Once you've crossed the main river - that is to say, in between the yeti and the third fortress
		[filter]
			side=1
			x=26,27-28
			y=30-31,32
		[/filter]

		 {M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "Well? We're past the river. Is it over now?")}
		 {M id=Cheska ( _ "Not quite. Although the worst is behind us, I believe, we still have a few small river branches to cross...")}
		 
		 # The camera pans to that final enemy base for a moment
		[scroll_to]
			x,y=21,41
		[/scroll_to]
		 {M id=Cheska ( _ "...and a few hostiles. Hopefully nothing we could not handle, after all we've been through already.")}
		 {M_OFFMAP $xel_stored.profile $xel_stored.name ( _ "Let's get to it. I want out of here.")}
	[/event]

