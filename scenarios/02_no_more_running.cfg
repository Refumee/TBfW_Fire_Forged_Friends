#textdomain wesnoth-fff
# TODO: Custom units for Cheska, Xel, Silan
# TODO: Turns/gold balancing
# TODO: Extra guards?
# TODO: What about player gold (for all three factions)?
[scenario]
    id="02_no_more_running"
    next_scenario=03_valley_of_early_winter

    name=_"No More Running"
	map_file=~add-ons/Fire_Forged_Friends/maps/02_no_more_running.map
    victory_when_enemies_defeated=yes

    {TURNS -1 -1 -1}

    {DEFAULT_SCHEDULE}

    {MOOD_DOOM}

    #################
    ### The Story ###
    #################
    [story]
        [part]
            story= _ "And so, by managing to escape the orc warband, their immediate death was thus avoided. But as much as she would have wished for a necromancer to face justice, commander Cheska knew where her duties lied: having escaped the horde, and with reinforcements from the lizardfolk, she now chose to take the fight back to the orcs, only sending a messenger to the capitol to explain of what had happened and that she was in a dire need of reinforcements.
Let's just hope there won't be as many orcs this time, Silan commented sardonically, but none paid attention to him."
        [/part]
        [part]
            story= _ "They had received reports about more orc raids from further east, which is where Cheska chose to lead her troops next. Still hopelessly outnumbered, perhaps, at least now she had some idea of what to expect. Backed up by saurians, she intended to wage guerilla warfare against the invaders, liberate towns and villages that had been occupied, and perhaps recruit some more reinforcements."
        [/part]
    [/story]


    ###################
    ### Player Side ###
    ###################
	# Cheska is TC green
	# Silan is TC White
	# Xel is TC Red
    [side]
        side=1
        controller=human

        persistent=yes
        save_id=Cheska

        team_name=rats
        user_team_name=_"Cheska's Company"

        color=green

        no_leader=yes # See [unit] tag below for leader

        recruit=Spearman,Horseman,Bowman,Saurian Skirmisher,Saurian Augur

        {GOLD 150 120 90}

        [unit]
            id=Cheska
            type=Cheska
            name=_"Cheska"
            unrenamable=yes
            gender=female
            random_traits=no
            canrecruit=yes
            x,y=1,1
        [/unit]
    [/side]

    ####################
    ### Enemy Side 1 ###
    ####################
    [side]
        side=2
        color=black
        controller=ai
        team_name=orcs
        type=Orcish Warrior
		profile=portraits/orcs/grunt-2.webp
        id=Boss
        name= _ "Boss"
        role=orcS
        canrecruit=yes
        recruit=Orcish Grunt,Wolf Rider,Orcish Archer,Goblin Spearman
        {GOLD 100 200 300}
    [/side]

    ####################
    ### Enemy Side 2 ###
    ####################
    [side]
        side=3
        color=orange
        controller=ai
        team_name=drakes
        no_leader=yes

        recruit=Drake Burner,Drake Glider,Drake Fighter # no Drake Clasher in swamps
        {GOLD 50 100 150}
        [ai]
			[goal]
				name=target
				[criteria]
					race=lizard # He and his troops will focus primarily upon saurians, but are willing to attack just about anything else if there's none of them around.
				[/criteria]
				value=100
			[/goal]
        [/ai]
    [/side]


    ##############
    ### Setup: ###
    ##############
    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Defeat the enemy commander."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska, Silan, or Xel"
            [/objective]
        [/objectives]

		[modify_unit]
			[filter]
				id=Silan
			[/filter]
			extra_recruit="Soulless,Blood Bat,Ghoul,Ghost"
		[/modify_unit]
	
		{UNIT 2 ("Orcish Grunt") 11 20 id=Lackey} {GUARDIAN}
		{UNIT 2 ("Orcish Grunt") 7 20 ()} {GUARDIAN}
		{UNIT 2 ("Orcish Archer") 15 15 ()} {GUARDIAN}
		{UNIT 2 ("Orcish Grunt") 18 22 ()} {GUARDIAN}
		{UNIT 2 ("Orcish Grunt") 9 21 ()} {GUARDIAN}
		{UNIT 2 ("Orcish Grunt") 5 13 ()} {GUARDIAN}
		{UNIT 2 ("Orcish Archer") 4 14 ()} {GUARDIAN}
		{UNIT 2 ("Orcish Grunt") 15 20 ()} {GUARDIAN}
		{UNIT 2 ("Orcish Grunt") 17 18 ()} {GUARDIAN}
    [/event]

	{STARTING_VILLAGES_ALL 2}

    ####################
    ### Start event: ###
    ####################

    [event]
        name=start

		### The player begins from the top-left corner, while the orcs have the area in the south. Plenty of orcs occupying the castle ruins, and a few in the swamp: these are mostly grunts and archers, with a couple little goblins thrown in. The eastern swamp castle, however, is empty - at least at first.

		{MOVE_UNIT id=Cheska 5 4 }
		
		{BUILD_CAMP Ke 5 4}
		{BUILD_CAMP Ce 4 4}
		{BUILD_CAMP Ce 5 5}
		{BUILD_CAMP Ce 6 4}
		{BUILD_CAMP Ce 6 3}
		{BUILD_CAMP Ce 5 3}
		{BUILD_CAMP Ce 6 5}
		{BUILD_CAMP Ce 7 5}
		{BUILD_CAMP Ce 7 4}
		
		[recall]
			id=Elric
		[/recall]
		[recall]
			id=Silan
		[/recall]
		[recall]
			id=Xel
		[/recall]
		[recall]
			id=Zeza
		[/recall]

		[modify_unit]
			[filter]
				id=Cheska
			[/filter]
			[filter_recall]
				race=human
			[/filter_recall]
		[/modify_unit]

        [fire_event]
            name=intro_dialogue
        [/fire_event]
    [/event]

    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue

		{M id=Boss ( _ "You know, boys (Chew)... These humans, they're pretty weak and not much of a challenge in battle (Munch)... but I got to admit, their food is pretty okay.")}
		{M id=Lackey ( _ "Um... commander...?")}
		{M id=Boss ( _ "What?! How dare you interrupt my dinner time?!")}
		{M id=Lackey ( _ "Yeah, sorry about that. But you see, we're being approached by a bunch of humans.")}
		{M id=Boss ( _ "More humans looking for their doom? ...Are there many?")}
		[if]
			[have_unit]
				id=Zeza
			[/have_unit]
			[then]
				{M id=Lackey ( _ "By the looks of it, nope. They have a few of them weird lizard things, though. Little ones. Okay, one of them's pretty big." )} #The last part is only added if Zeza didn't perish in the first mission.
			[/then]
		[/if]
		{M id=Boss ( _ "Hmph, maybe they'll prove to be a bit of amusement. Prepare for battle!")}
		{M id=Cheska ( _ "Well?")}
		
		[recall]
			type=Saurian Flanker,Saurian Ambusher,Saurian Skirmisher
			x,y=5,9
		[/recall]
		[if]
			[have_unit]
				x,y=5,9
			[/have_unit]
			[then]
				[role]
					x,y=5,9
					role=scout
				[/role]
			[/then]
			[else]
				{UNIT 1 ("Saurian Skirmisher") 5 9 role=scout}
				[object]
					[filter]
						role=scout
					[/filter]
					[effect]
						apply_to=image_mod
						add=RC(magenta>red)
					[/effect]
				[/object]
			[/else]
		[/if]

		{MOVE_UNIT role=scout 7 6 }
		{M role=scout ( _ "The orcs have the place locked up pretty well. There are remains of an old castle here, a large one, that's fallen into disuse and disrepair long ago: they're using that.")}
		{M id=Cheska ( _ "What of human population?")}
		{M role=scout ( _ "Even though the castle's been like this for ages, a lot of humans would seem to have lived here until very recently. The orcs have changed matters, of course: we haven't got a clue how many still remain.")}
		{M id=Silan ( _ "Hmm. A large number of orcs, heavily fortified behind the walls of an ancient human fortress. I cannot help but wonder if you two can handle this without help?")}
		{M id=Cheska ( _ "Silence, you.")}
		{M id=Xel ( _ "But he does have a point. Even if we can handle this by ourselves, the cost will be great.")}
		{M id=Cheska ( _ "But what of the cost if we DO let him away?")}
		{M id=Silan ( _ "This is your duty as a battle commander: you must think of your own men as well, and if you can save many of their lives by taking the slim chance that a necromancer might run away from your grasp - and I can promise you I won't be running away - then you should seize that opportunity. Saving lives is more important than anything.")}
		{M id=Cheska ( _ "That... might be the most hypocritical thing I've ever heard.")}
		{M id=Silan ( _ "But it does make sense.")}
		{M id=Xel ( _ "I say we let him go. He was a great help the last time we fought together.")}
		{M id=Cheska ( _ "So... you promise to not run away or turn on us at the first opportunity?")}
		{M id=Silan ( _ "Certainly! All I ever wished was to aid Wesnoth on its time of need, and here there is exactly such time. My duty is right here.")}
		{M speaker=narrator ( _ "A short period of silence.")}
		{M id=Cheska ( _ "...Fine. But I will be watching you. Release him!")}
		{M speaker=narrator ( _ "Sounds of shackles being taken away.")}
		{M id=Silan ( _ "Right, thanks for that. Now then... how shall we do this?")}
		{M id=Cheska ( _ "Well. We can expect the main force of the enemy directly from the south, so that is where most of the battle will be done.")}
		{M id=Silan ( _ "The two of us can probably handle that.")}
		{M id=Cheska ( _ "Xel, can I assume we can leave the swamp for you?")}
		{M id=Xel ( _ "Yes. I will deal with the few orcs there, secure the villages, and flank the enemy.")}
		{M id=Silan ( _ "I can support him with a few ghosts. They can literally fly past anything that would slow down anybody else. A bit of swamp is smalltime.")}
		{M id=Lackey ( _ "Sounds like they've got a plan. What about us?")}
		{M id=Boss ( _ "Plan? What plan?")}
		{M id=Lackey ( _ "Boss, you're my favourite chief ever.")}

        {CUE_EPIC}
        {MOOD_EPIC}
    [/event]
	
	#Some more dialogue will ensue as soon as the player captures any one of the villages in the immediate vicinity of the map
	[event]
		name=capture
		first_time_only=yes

        [filter]
            side=1
            [filter_location]
                terrain=*^Vh*
            [/filter_location]
        [/filter]

		{UNIT 1 Peasant $x1 $y1 id=Peasant}
		[object]
			[filter]
				id=Peasant
			[/filter]
			[effect]
				apply_to=image_mod
				add=RC(magenta>lightblue)
			[/effect]
		[/object]

		{M id=Peasant ( _ "No! Noo! Stay away from me, monster, stay away from-")} #The peasant then joins your party. He won't do much by himself, but maybe you can keep him alive long enough to upgrade him to something stronger.
		{M id=Silan ( _ "Hush! Relax, friend! I am not going to harm you")}
		{M id=Peasant ( _ "...Oh...? You don't intend to stab me at night or anything like that...?")}
		{M id=Silan ( _ "Rest assured, that is not my intention. My troops may look frightening, but all we are looking to do here is to liberate this area from orcs.")}
		{M id=Peasant ( _ "Oh, well... I suppose that's okay, then. It's about time for that, you know, we've been under their occupation for a week now! It has not been fun; many of us have died already, and the rest are utterly miserable.")}
		{M id=Cheska ( _ "Well, we are here to change that.")}
		
	[/event]

	### Turn 2 opens with the following little piece of dialogue
    [event]
        name=turn 2
		{M id=Silan ( _ "You know, I have to say I am positively surprised by your attitude. Most people simply try to kill me on sight, no matter what the circumstances might be!")}
		{M id=Cheska ( _ "I am still considering it. Don't push me.")}
    [/event]

	### On turn 3, the circumstances change a bit, when the eastern swamp castle is suddenly occupied by drakes. All swamp and water villages (minus the westernmost one, the one very close to your starting location) immediately go to their possession. They are led by a drake warrior called Gak, and they are considered an enemy by both the player and the orcs.
	### Xel reacts strongly upon seeing them
    [event]
        name=turn 3
		
        [unit]
            type=Drake Warrior
            side=3
            id=Gak
            name= _"Gak"
            experience=15
            x,y=33,19
			canrecruit=yes
        [/unit]
		{UNIT 3 ("Drake Fighter") 34 19 ()}
		{UNIT 3 ("Drake Fighter") 34 18 ()}
		{UNIT 3 ("Drake Glider") 34 25 ()}
		{UNIT 3 ("Drake Glider") 34 10 ()}
		
		{MOVE_UNIT id=Gak 31 17 }
		{MOVE_UNIT x,y=34,19 28 17 }
		{MOVE_UNIT x,y=34,18 32 15 }
		{MOVE_UNIT x,y=34,25 29 24 }
		{MOVE_UNIT x,y=34,10 32 12 }
		
		{CAPTURE_VILLAGES_OF_TYPE (*^Vhs) 3 31 17 10}
		{CAPTURE_VILLAGES_OF_TYPE (*^Vm) 3 31 17 8}
		
		{M id=Xel ( _ "Oh, no. No. No!")}
		{M id=Gak ( _ "Oh, hello there! You must be the one we're looking for.")}
		{M id=Cheska ( _ "Xel? Do you know them?")}
		{M id=Gak ( _ "The name's Gak, human lady, and I seek to bring this little fugitive back home, dead or alive. They're offering quite a bit of money for his head!")}
		{M id=Xel ( _ "They... do? Why? I am not that important!")}
		{M id=Gak ( _ "Not a clue. I think they were explaining something about the whole thing, but to be honest, I didn't much listen. I only want the money.")}
		{M id=Xel ( _ "Oh...")}
		{M speaker=narrator ( _ "He looks obviously relieved - whether it's because these people are just mercenaries instead of a real force of justice, or because they know not of his past, is unknown at the present.")}
		{M id=Cheska ( _ "Are you sure you can handle this guy? I could help you.")}
		{M id=Gak ( _ "Do not interfere! I have no business with you, and you have no business with this cretin!")}
		{M id=Cheska ( _ "I might have.")}
		{M id=Xel ( _ "No. This is my fight. And your troops don't fare well at the swamp anyway.")}
		{M speaker=narrator ( _ "...")}
		{M id=Xel ( _ "But... Cheska?")}
		{M id=Cheska ( _ "Yes?")}
		{M id=Xel ( _ "I really appreciate the notion. Thanks.")}
		{M id=Cheska ( _ "Think nothing of it.")}
		
        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Kill both enemy commanders."
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska, Silan, or Xel"
            [/objective]
        [/objectives]
    [/event]

	### If/when Xel makes contact with the enemy drakes
    [event]
        name=attack end
		id=xel_attacks_drake
		first_time_only=yes
        [filter]
            id=Xel
        [/filter]
        [filter_second]
            side=3
        [/filter_second]
		{M id=Gak ( _ "Oho, little lizard comes to the fight himself! Have you done running away?")}
		{M id=Xel ( _ "I will not run away from filth like you!")}
		[remove_event]
			id=drake_attacks_xel
		[/remove_event]
    [/event]
    [event]
        name=attack end
		id=drake_attacks_xel
		first_time_only=yes
        [filter]
            side=3
        [/filter]
        [filter_second]
			id=Xel
        [/filter_second]
		{M id=Gak ( _ "Oho, little lizard comes to the fight himself! Have you done running away?")}
		{M id=Xel ( _ "I will not run away from filth like you!")}
		[remove_event]
			id=xel_attacks_drake
		[/remove_event]
    [/event]

	### When Gak finally falls, he has this to say
    [event]
        name=last breath
        [filter]
            id=Gak
        [/filter]
		{M id=Xel ( _ "You were killed for the sake of money. Was it really worth it?")}
		{M id=Gak ( _ "Dying... is never worth... it...")}
		{M id=Silan ( _ "I beg to differ.")}
		{M id=Cheska ( _ "I'm sure you would.")}
		{M id=Silan ( _ "I did not mean it like that! For your information, I have no intention of coming back to this world when I finally snuff it. I simply meant that yes, there are indeed causes worth dying for.")}
		{M id=Cheska ( _ "I suppose there are.")}
    [/event]

    [event]
        name=victory
		
		{M id=Cheska ( _ "Both orcs and drakes have been routed. The victory is ours!")}
		{M id=Silan ( _ "So...")}
		{M id=Cheska ( _ "Yes? What?")}
		{M id=Silan ( _ "Have I earned your trust yet?")}
		{M id=Cheska ( _ "Hmm... perhaps not quite. But I think I will trust you enough to not put you back in chains.")}
		{M id=Silan ( _ "Many thanks! I know how hard it is for a loyal Wesnothian human to trust a necromancer, and rest assured, I have no intention to betray that trust.")}
		{M id=Cheska ( _ "See that you don't.")}
		{M id=Silan ( _ "Furthermore, are you thinking what I am thinking? About this place?")}
		{M id=Cheska ( _ "If what you are thinking is that it might make a good base of operations to our war against orcs, then yes, we are on the same carriage of thought.")}
		{M id=Silan ( _ "Oh, indeed! Perhaps we might also recruit a few peasants? They do not seem to be as frightened of me here as they would be in the heart of the nation.")}
		{M id=Cheska ( _ "Perhaps so. Although I do think they could use a bit of that fear. It would keep them wary.")}
		{M id=Xel ( _ "Um, Cheska? Can we talk?")}
		{M id=Cheska ( _ "Certainly. What's in your mind?")}
		{M id=Xel ( _ "I... While I really appreciate what you did just now, with your offer of help... I really don't think it was all that appropriate.")}
		{M id=Cheska ( _ "Why is that?")}
		{M id=Xel ( _ "We have only known each other for a few days. It is such a little time. You know nothing of me, and even less of the circumstances between me and the rest of my kind. I do not deserve your help.")}
		{M id=Silan ( _ "Oh, don't be such a fool. Cheska offered her aid because she wanted to help you, that's all. None of us would wish to see a little guy like you getting bullied by big mean lizards such as that Gak fellow. Mighty good job you did with him, by the way.")}
		{M id=Xel ( _ "...Thank you.")}

		[store_unit]
			[filter]
				id="Silan"
			[/filter]
			variable=silan_stored
			kill=yes
		[/store_unit]
		[store_unit]
			[filter]
				race=undead
			[/filter]
			variable=undead_stored
			kill=yes
		[/store_unit]
		[store_unit]
			[filter]
				race=bats
			[/filter]
			variable=bats_stored
			kill=yes
		[/store_unit]
		[modify_unit]
			[filter]
				id=Cheska
			[/filter]
			[filter_recall]
				race=human,lizard,drake
			[/filter_recall]
		[/modify_unit]
    [/event]

    [event]
        name=die
        [filter]
            id=Silan,Xel,Cheska
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

	{FFF_TC_COLORING 1 (race=lizard) red}
	{FFF_TC_COLORING 1 (race=undead) white}
	{FFF_TC_COLORING 1 (race=bats) white}
[/scenario]
