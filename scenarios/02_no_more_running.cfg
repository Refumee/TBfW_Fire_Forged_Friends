#textdomain wesnoth-fff
# TODO: Custom units for Cheska, Xel, Silan
# TODO: Turns/gold balancing
# TODO: Extra guards?
# TODO: What about player gold (for all three factions)?
[scenario]
    id="02_no_more_running"
    next_scenario=03_valley_of_early_winter

    name=_"No More Running"
	map_file=~add-ons/Fire_Forged_Friends/maps/02_no_more_running.map
    victory_when_enemies_defeated=yes

    {TURNS 18 15 12}

    {DEFAULT_SCHEDULE}

    {MOOD_DOOM}

    #################
    ### The Story ###
    #################
    [story]
        [part]
            story=_ "todo."
        [/part]
    [/story]


    ###################
    ### Player Side ###
    ###################
	# Cheska is TC green
	# Silan is TC White
	# Xel is TC Red
    [side]
        side=1
        controller=human

        persistent=yes
        save_id=Cheska

        team_name=rats
        user_team_name=_"Cheska's Company"

        color=green

        no_leader=yes # See [unit] tag below for leader

        recruit=Spearman,Horseman,Bowman

        {GOLD 150 120 90}

        [unit]
            id=Cheska
            type=Captain
            name=_"Cheska"
            unrenamable=yes
            gender=female
            random_traits=no
            canrecruit=yes
            x,y=1,1
        [/unit]
    [/side]

    ####################
    ### Enemy Side 1 ###
    ####################
    [side]
        side=2
        color=black
        controller=ai
        team_name=orcs
        type=Orcish Warlord
		profile=portraits/orcs/grunt-2.webp
        id=Larry
        name= _ "Larry"
        role=orcS
        canrecruit=yes
        recruit=Orcish Grunt,Wolf Rider,Orcish Archer,Orcish Assassin,Goblin Spearman
        {GOLD 400 600 800}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ####################
    ### Enemy Side 2 ###
    ####################
    [side]
        side=3
        color=brown
        controller=ai
        team_name=orcs
        type=Orcish Warrior
		profile=portraits/orcs/grunt-3.webp
        id=Moe
        name= _ "Moe"
        role=orcNE
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ####################
    ### Enemy Side 3 ###
    ####################
    [side]
        side=4
        color=orange
        controller=ai
        team_name=orcs
        type=Orcish Warrior
        id=Curly
        name= _ "Curly"
        role=orcNW
        canrecruit=yes
        recruit=Orcish Assassin,Orcish Grunt,Orcish Archer
        {GOLD 150 200 250}
        [ai]
            aggression=0.6
            grouping=no
            recruitment_pattern=fighter,fighter,mixed fighter
        [/ai]
    [/side]

    ##############
    ### Setup: ###
    ##############
    [event]
        name=prestart
        [objectives]
            side=1
            [objective]
                condition=win
                description=_ "Move Cheska to the signpost in the north"
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Cheska Kuhral"
            [/objective]
        [/objectives]
        [objectives]
            side=2
            [objective]
                condition=win
                description=_ "Help Cheska get to the signpost in the north"
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Silan Abner"
            [/objective]
        [/objectives]
        [objectives]
            side=3
            [objective]
                condition=win
                description=_ "Help Cheska get to the signpost in the north"
            [/objective]
            [objective]
                condition=lose
                description=_ "Death of Xel"
            [/objective]
        [/objectives]
    [/event]

    ###################################
    ### Control and victory events: ###
    ###################################

    [event]
        name=start

		{MOVE_UNIT id=Cheska 5 4 }
		
		{BUILD_CAMP Ke 5 4}
		{BUILD_CAMP Ce 4 4}
		{BUILD_CAMP Ce 5 5}
		{BUILD_CAMP Ce 6 4}
		{BUILD_CAMP Ce 6 3}
		{BUILD_CAMP Ce 5 3}
		{BUILD_CAMP Ce 6 5}
		{BUILD_CAMP Ce 7 5}
		{BUILD_CAMP Ce 7 4}
		
		[recall]
			id=Elric
		[/recall]
		[recall]
			id=Silan
		[/recall]
		[recall]
			id=Xel
		[/recall]
		[recall]
			id=Zeza
		[/recall]
		
        [fire_event]
            name=intro_dialogue
        [/fire_event]
    [/event]

    ##################################
    ### Story and dialogue events: ###
    ##################################
    [event]
        name=intro_dialogue
        {M role=orcS (_"Keep running, little man-girl! You make wonderful sport!")}
        {M id=Cheska (_"*Hahh* So tired... I really have to stop and... rest for a moment.")}
        {M speaker=narrator (_"Hm? Those are not orc voices I hear...")}

        {M role=patrol (_"Woah!")}

        {CUE_EPIC}
        {MOOD_EPIC}
    [/event]

 
    [event]
        name=die
        [filter]
            id=Silan
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            id=Xel
        [/filter]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

[/scenario]
